      - {
          field: "nodeid",
          headerName: "Node ID",
          headerTooltip: "Identifier of the node",
          cellDataType: "text",
          pinned: "left",
          minWidth: 100,
          maxWidth: 180,
        }
      - {
          headerName: "State Info",
          groupId: "State",
          children: [
            {
              field: "status",
              headerName: "Event Status",
              headerTooltip: "Event tracking status (ACTIVE or RESOLVED)",
              cellDataType: "text",
              minWidth: 130,
              maxWidth: 150,
            },
            {
              field: "currentstate",
              headerName: "Slurm State",
              headerTooltip: "Current or last known Slurm state of the node",
              cellDataType: "text",
              minWidth: 110,
              maxWidth: 150,
            }
          ]
        }
      - {
          headerName: "Event Timeline",
          groupId: "Timeline",
          children: [
            {
              field: "down_date",
              headerName: "Down Date",
              headerTooltip: "Date and time the node went offline",
              cellDataType: "dateString",
              filter: "DateTimeParentFilter",
              floatingFilterComponent: "DateFloatingFilterComponent",
              minWidth: 160,
              maxWidth: 200,
            },
            {
              field: "resolved_date",
              headerName: "Resolved Date",
              headerTooltip: "Date and time the node issue was resolved",
              cellDataType: "dateString",
              filter: "DateTimeParentFilter",
              floatingFilterComponent: "DateFloatingFilterComponent",
              minWidth: 160,
              maxWidth: 200,
            }
          ]
        }        
      - {
          field: "reason",
          headerName: "Reason",
          headerTooltip: "Reason for the node outage",
          cellDataType: "text",
          cellClass: "text-left",
          wrapText: true,
          autoHeight: true,
          flex: 3,
          minWidth: 300,
        }


