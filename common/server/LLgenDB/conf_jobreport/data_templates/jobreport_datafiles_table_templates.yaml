- dataset:
    name: template_queuedjoblist
    set: template
    filepath: '$outputdir/LLtemplates/queuedjobslist.handlebars'
    stat_database: jobreport_json_stat
    stat_table: datasetstat_templates
    format: 'datatable'
    ag-grid-theme: 'balham'
    columns:
      # The primary identifier is pinned for continuous visibility while scrolling
      - {
          field: "jobid",
          headerName: "JobID",
          headerTooltip: "Slurm JobID",
          cellDataType: "number",
          valueGetter: "(params) => params.data ? parseInt(params.data.jobid, 10) : null",
          pinned: "left",
          minWidth: 75,
          maxWidth: 90,
        }

      # General job properties are grouped for a clean default view
      - {
          headerName: "General Info",
          groupId: "Info",
          children: [
            {
              field: "owner",
              headerName: "Owner", 
              headerTooltip: "User owner of the job",
              cellDataType: "text",
              cellRenderer: "(params) => gen_project_user_link(params,'/data/ll/user','account')",
              cellClass: "text-left",
            },
            {
              field: "account",
              headerName: "Project",
              headerTooltip: "Budget used for job submission",
              cellDataType: "text", 
              cellRenderer: "(params) => gen_project_link(params,'/data/ll/project')",
              cellClass: "text-left",
            },
            {
              field: "queue",
              headerName: "Queue",
              cellDataType: "text",
              headerTooltip: "Slurm partition",
            },
          ]
        }

      # Mentor is kept as a standalone column matching the main job table design
      - { 
          field: "mentor",
          cellDataType: "text", 
          headerName: "Mentor", 
          cellRenderer: "(params) => gen_mentor_link(params,'/data/ll/mentor')",
          headerTooltip: "Mentor of the project",
          cellClass: "text-left",
        }

      # Scheduling and timing metrics leverage custom date and time interval data types
      - {
          headerName: "Scheduler",
          groupId: "Scheduler",
          children: [
            { 
              field: "state",
              headerName: "State",
              cellDataType: "text",
              headerTooltip: "State of the Job",
            },
            { 
              field: "queuedate",
              cellDataType: "dateString",
              headerName: "Queue Date",
              headerTooltip: "Date when the job was queued",
              filter: "DateTimeParentFilter",
              floatingFilterComponent: "DateFloatingFilterComponent",
            },
            { 
              field: "starttime",
              cellDataType: "dateString",
              headerName: "Start Date (est)",
              headerTooltip: "Start date (or estimate) of the job",
              filter: "DateTimeParentFilter",
              floatingFilterComponent: "DateFloatingFilterComponent",
            },
            { 
              field: "endtime",
              columnGroupShow: "open",
              cellDataType: "dateString",
              headerName: "End Date (est)",
              headerTooltip: "End date (or estimate) of the job",
              filter: "DateTimeParentFilter",
              floatingFilterComponent: "DateFloatingFilterComponent",
            },
            { 
              field: "wall",
              columnGroupShow: "open",
              headerName: "Walltime",
              headerTooltip: "Requested walltime",
              cellDataType: "timeInterval",
              filter: "TimeIntervalParentFilter",
              floatingFilterComponent: "TimeIntervalFloatingFilterComponent",
            },
            { 
              field: "runtime",
              columnGroupShow: "open",
              headerName: "Runtime",
              headerTooltip: "Overall runtime",
              cellDataType: "timeInterval",
              filter: "TimeIntervalParentFilter",
              floatingFilterComponent: "TimeIntervalFloatingFilterComponent",
            },
            { 
              field: "numnodes",
              cellDataType: "number",
              headerName: "#Nodes",
              headerTooltip: "Number of nodes used by the job",
            },
            { 
              field: "resid",
              columnGroupShow: "open",
              cellDataType: "text",
              headerName: "Reservation",
              cellClass: "text-left",
              headerTooltip: "Reservation used by the job",
            },
          ]
        }

      # Array properties are grouped and hidden by default to save horizontal space
      - {
          headerName: "Array",
          groupId: "Array",
          children: [
            { 
              field: "ArrayJobId",
              headerName: "ArrayJobID",
              valueGetter: "(params) => (params.data && params.data.ArrayJobId) ? parseInt(params.data.ArrayJobId, 10) : null",
              cellDataType: "number",
              headerTooltip: "Array job ID (Slurm)",
            },
            { 
              field: "ArrayTaskId",
              headerName: "ArrayTaskID",
              cellDataType: "text",
              headerTooltip: "Array task ID (Slurm)",
            },
          ]
        }

- dataset:
    name: template_queueddetails
    set: template
    filepath: '$outputdir/LLtemplates/queueddetails.handlebars'
    stat_database: jobreport_json_stat
    stat_table: datasetstat_templates
    format: 'datatable'
    ag-grid-theme: 'balham'
    columns:
      %include "./jobreport_datafiles_datatable_templates_queued_columns.yaml"


# - dataset:
#     name: template_workflows
#     set:           template
#     filepath:      '$outputdir/LLtemplates/workflows.handlebars'
#     stat_database: jobreport_json_stat
#     stat_table:    datasetstat_templates
#     format:        'template'
#     columns:
#       %include "./jobreport_datafiles_table_templates_workflow_columns.yaml"

- dataset:
    name: template_workflows
    set: template
    filepath: '$outputdir/LLtemplates/workflows.handlebars'
    stat_database: jobreport_json_stat
    stat_table: datasetstat_templates
    format: 'datatable'
    ag-grid-theme: 'balham'
    columns:
      # The primary identifier is pinned to the left for persistent visibility
      - {
          field: "wf_id",
          headerName: "WorkflowID",
          headerTooltip: "Unique ID of the workflow",
          valueGetter: "(params) => params.data ? parseInt(params.data.wf_id, 10) : null",
          cellDataType: "number",
          filter: "agNumberColumnFilter",
          pinned: "left",
          minWidth: 90,
          maxWidth: 100,
        }
      # General ownership and typing metadata are grouped
      - {
          headerName: "General Info",
          groupId: "Info",
          children: [
            {
              field: "wf_type",
              headerName: "Type",
              headerTooltip: "Type of workflow",
              cellDataType: "text",
              minWidth: 90,
              maxWidth: 100,
              flex: 1, 
            },
            {
              field: "owner",
              headerName: "Owner",
              headerTooltip: "User owner of the workflow",
              cellDataType: "text",
              cellRenderer: "(params) => gen_project_user_link(params,'/data/ll/user','account')",
              minWidth: 100,
              flex: 1, 
            },
            {
              field: "account",
              headerName: "Project",
              headerTooltip: "Budget used for job submission",
              cellDataType: "text",
              cellRenderer: "(params) => gen_project_link(params,'/data/ll/project')",
              minWidth: 100,
              flex: 1, 
            },
          ]
        }

      # The mentor field sits as a standalone column matching the main jobs table structure
      - {
          field: "mentor",
          headerName: "Mentor",
          headerTooltip: "Mentor of the project",
          cellDataType: "text",
          cellRenderer: "(params) => gen_mentor_link(params,'/data/ll/mentor')",
          minWidth: 100,
          flex: 1,
        }

      # Scheduling and timing metrics utilize the custom date string engine
      - {
          headerName: "Scheduler",
          groupId: "Scheduler",
          children: [
            {
              field: "firstts",
              headerName: "Start Date",
              headerTooltip: "Start date of first job in workflow",
              cellDataType: "dateString",
              filter: "DateTimeParentFilter",
              floatingFilterComponent: "DateFloatingFilterComponent",
              minWidth: 140,
              flex: 1, 
            },
            {
              field: "lastts",
              headerName: "Last Update",
              headerTooltip: "Date of last update from scheduler or end time of last job of workflow",
              cellDataType: "dateString",
              filter: "DateTimeParentFilter",
              floatingFilterComponent: "DateFloatingFilterComponent",
              minWidth: 140,
              flex: 1, 
            },
            {
              field: "numnodes_avg",
              headerName: "#Nodes",
              headerTooltip: "Average number of nodes used by the jobs in the workflow",
              cellDataType: "number",
              maxWidth: 90,
              flex: 1, 
            },
          ]
        }

      # System utilization metrics are grouped and formatted
      - {
          headerName: "Load/Memory",
          groupId: "Load/Memory",
          children: [
            {
              field: "load_avg",
              headerName: "CPU Load",
              headerTooltip: "CPU load, 1-min average among all jobs, nodes and over time",
              cellDataType: "number",
              valueFormatter: "(params) => round_number(params)",
              maxWidth: 110,
              flex: 1, 
            },
          ]
        }

      # The list of jobs requires text wrapping to prevent hiding workflow execution history
      - {
          field: "jobid_list",
          headerName: "JobID List",
          headerTooltip: "Jobs in the workflow (States: [P->Pending] [R->Running] [C->Complete] [F->Failed])",
          cellDataType: "text",
          cellRenderer: "(params) => gen_jobid_list_link(params)",
          wrapText: true, 
          autoHeight: true,
          flex: 4, 
          minWidth: 250,
        }



