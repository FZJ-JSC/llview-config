- table:
    name: currentjobs_chiplist
    options:
      update:
        sql_update_contents:
          vars: mintsinserted
          sql: DELETE FROM currentjobs_chiplist;
               INSERT INTO currentjobs_chiplist (jobid,chiplastts,chiplist)
                                                SELECT jobid,ts, 
                                                GROUP_CONCAT(chipid,' ') 
                                                FROM chippower_aggr_by_jobid_nodeid_chipid WHERE jobid
                                                     IN (select jobid from chippower_current_jobid)
                                                GROUP by jobid
    columns: 
      - { name: jobid,           type: jobid_t }
      - { name: chiplist,        type: extralongstr_t  }
      - { name: chiplastts,      type: ts_t    }

- table:
    name: currentjobs_chipspec
    options:
      update:
        sql_update_contents:
          vars: mintsinserted
          sql: DELETE FROM currentjobs_chipspec;
               INSERT INTO currentjobs_chipspec (jobid,chipspec)
                                                SELECT jobid, 
                                                GROUP_CONCAT(chipinfo,' ') 
                                                FROM
                                                (
                                                  SELECT jobid,
                                                  chipid||":"||
                                                       round(power_avg,1)||"W "||
                                                       round(cpupower_avg,1)||"W "||
                                                       round(cpupowercap_avg,1)||"W "
                                                         AS chipinfo
                                                  FROM chippower_aggr_by_jobid_nodeid_chipid
                                                  WHERE jobid IN (select jobid from chippower_current_jobid)
                                                  ORDER by chipid
                                                ) GROUP by jobid
    columns: 
      - { name: jobid,           type: jobid_t }
      - { name: chipspec,        type: extralongstr_t  }

      
      
#----------------------------
# temp. tables to speed joins 
#----------------------------
- table:
    name: chippower_jobmap_by_nd_minmaxts
    options:
      update:
        sql_update_contents:
          vars: mintsinserted
          sql: DELETE FROM chippower_jobmap_by_nd_minmaxts;
               INSERT INTO chippower_jobmap_by_nd_minmaxts
                   SELECT jt.jobid,
                          jn.nodeid,
                          min(jt.ts),
                          max(jt.ts)
                          FROM jobnodemap jn, jobtsmap jt
                          WHERE (jt.jobid=jn.jobid)
                          GROUP BY jt.jobid,jn.nodeid;
      index: jobid,nodeid,maxts
    columns: 
      - { name: jobid,    type: jobid_t }
      - { name: nodeid,   type: nodeid_t }
      - { name: mints,    type: ts_t    }
      - { name: maxts,    type: ts_t    }

# subtracted 59 sec to catch same one minute interval      
- table:
    name: chippower_current_jobid
    options:
      update:
        sql_update_contents:
          vars: mintsinserted
          sql: DELETE FROM chippower_current_jobid;
               INSERT INTO chippower_current_jobid
                    SELECT jt.jobid
                           FROM jobtsmap jt
                           WHERE (jt.ts >= mintsinserted - 59);
      update_trigger:
      index: jobid
    columns: 
      - { name: jobid,    type: jobid_t }
