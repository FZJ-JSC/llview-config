- dataset:
    name: chippower_chip_dat
    set:        chippower
    FORALL:     'P,U,J:VAR_project_user_job'
    filepath:   '$outputdir/projects/$P/$U/Chippower_${J}_chip.dat'
    columns:        'jobid,ts,chipid,gpu_pu,power,cpupower,cpupowercap'
    column_filemap: 'J:jobid'
    column_ts:      'ts'
    format:         'dat'
    format_str:      '%-10s %10d %12s %10.3f %10.3f %10.3f %10.3f'
    format_header:   '%-10s %10s %12s %10s %10s %10s %10s'
    column_filemap: 'J:jobid'
    data_database:   powerstate
    data_table:      chippower_by_jobid_nodeid_chipid_ts
    stat_database:   jobreport_stat_chippower
    stat_table:      datasetstat_chip_dat
    mngt_actions:   'compress_finished_files,archive_jobs_files'

- dataset:
    name: chippower_chip_csv
    set:        chippower
    FORALL:     'P,U,J:VAR_project_user_job'
    filepath:   '$outputdir/projects/$P/$U/Chippower_${J}.csv'
    columns:        'ts,gpu_pu_min,gpu_pu_avg,gpu_pu_max,power_min,power_avg,power_max,cpupower_min,cpupower_avg,cpupower_max,cpupowercap_min,cpupowercap_avg,cpupowercap_max'
    header:         'date,gpu_pu,power,cpupower,cpupowercap'
    column_convert: 'ts->todate_1,gpu_pu_min->cut3digits,gpu_pu_avg->cut3digits,gpu_pu_max->cut3digits, 
                                  power_min->cut3digits,power_avg->cut3digits,power_max->cut3digits, 
                                  cpupower_min->cut3digits,cpupower_avg->cut3digits,cpupower_max->cut3digits, 
                                  cpupowercap_min->cut3digits,cpupowercap_avg->cut3digits,cpupowercap_max->cut3digits'
    format_str:      '%s,%f;%f;%f,%f;%f;%f,%f;%f;%f,%f;%f;%f'
#    renew:          'always'
    column_filemap: 'J:jobid'
    column_ts:      'ts'
    format:         'csv'
    column_filemap: 'J:jobid'
    data_database:   powerstate
    data_table:      chippower_aggr_by_jobid_ts
    stat_database:   jobreport_stat_chippower
    stat_table:      datasetstat_csv
    mngt_actions:   'compress_finished_files,archive_jobs_files'
