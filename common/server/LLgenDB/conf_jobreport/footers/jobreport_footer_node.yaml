#############
# Footer NODE
#############
- footersetelem:
    name: "Node"
    info: "Job: #JobID#"
    graphs: 
       - graph:
            name: "NodePower"
            xcol: "date"
            layout:
              yaxis: 
                  title: 
                    text: "W"
            datapath: "data/projects/#Project#/#Owner#/Nodepower_#JobID#.csv"
            traces:
              - trace:
                  name:   "power"
                  ycol: "power"
                  yaxis:  "y"
                  type:   "scatter"
                  color:  "#A00000"
       - graph:
            name: "NodeTemp"
            xcol: "date"
            layout:
              yaxis: 
                  title: 
                    text: "degree C"
            datapath: "data/projects/#Project#/#Owner#/Nodepower_#JobID#.csv"
            traces:
              - trace:
                  name:   "temp"
                  ycol: "temp"
                  yaxis:  "y"
                  type:   "scatter"
                  color:  "#A00000"


