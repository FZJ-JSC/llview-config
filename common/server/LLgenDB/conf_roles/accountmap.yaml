accountmap:
  tables:
    - table:
        name: usermap
        options:
          update:
            LML: usermap
            mode: replace
          update_trigger:
            - allprojects
            - alluser
            - rolelist
        columns: 
          - { name: id,              type: name_t,            LML_from: id,              LML_default: 'unknown' }
          - { name: u_ts,            type: ts_t,              LML_from: ts,              LML_default: -1        }
          - { name: project,         type: name_t,            LML_from: project,         LML_default: "-"       }
          - { name: wsaccount,       type: name_t,            LML_from: wsaccount,       LML_default: 'unknown' }

    - table:
        name: mentormap
        options:
          update:
            LML: mentormap
            mode: replace
          update_trigger:
            - mentorlist
            - rolelist
        columns: 
          - { name: id,              type: name_t,            LML_from: id,              LML_default: 'unknown' }
          - { name: u_ts,            type: ts_t,              LML_from: ts,              LML_default: -1        }
          - { name: project,         type: name_t,            LML_from: project,         LML_default: "-"       }
          - { name: wsaccount,       type: name_t,            LML_from: wsaccount,       LML_default: 'unknown' }

    - table:
        name: pipamap
        options:
          update:
            LML: pipamap
            mode: replace
          update_trigger:
            - rolelist
        columns: 
          - { name: id,              type: name_t,            LML_from: id,              LML_default: 'unknown' }
          - { name: wsaccount,       type: name_t,            LML_from: wsaccount,       LML_default: 'unknown' }
          - { name: kind,            type: shortstr_t,        LML_from: kind,            LML_default: 'unknown' }
          - { name: u_ts,            type: ts_t,              LML_from: ts,              LML_default: -1        }
          - { name: project,         type: name_t,            LML_from: project,         LML_default: "-"       }

    - table:
        name: supportmap
        options:
          update:
            LML: supportmap
            mode: replace
          update_trigger:
            - support
            - alluser
            - rolelist
        columns: 
          - { name: id,              type: name_t,            LML_from: id,              LML_default: 'unknown' }
          - { name: wsaccount,       type: name_t,            LML_from: wsaccount,       LML_default: 'unknown' }
          - { name: u_ts,            type: ts_t,              LML_from: ts,              LML_default: -1        }

    - table:
        name: usermap_slurm
        options:
          update:
            LML: usermap_slurm
            mode: replace
          update_trigger:
            - allprojects
            - alluser
            - rolelist
        columns: 
          - { name: id,              type: name_t,            LML_from: id,              LML_default: 'unknown' }
          - { name: ts,              type: ts_t,              LML_from: ts,              LML_default: -1        }
          - { name: project,         type: name_t,            LML_from: project,         LML_default: "-"       }
          - { name: wsaccount,       type: name_t,            LML_from: wsaccount,       LML_default: 'unknown' }

    - table:
        name: supportmap_slurm
        options:
          update:
            LML: supportmap_slurm
            mode: replace
          update_trigger:
            - support
            - alluser
            - rolelist
        columns: 
          - { name: id,              type: name_t,            LML_from: id,              LML_default: 'unknown' }
          - { name: ts,              type: ts_t,              LML_from: ts,              LML_default: -1        }
          - { name: wsaccount,       type: name_t,            LML_from: wsaccount,       LML_default: 'unknown' }

    - table:
        name: allprojects
        options:
          update:
            sql_update_contents:
              sql: DELETE FROM allprojects;
                   INSERT INTO allprojects 
                   SELECT project FROM usermap WHERE u_ts >= CAST(strftime('%s', 'now') AS INTEGER) - 86400
                   UNION 
                   SELECT project FROM usermap_slurm;
        columns: 
          - { name: project,         type: name_t }

    - table:
        name: alluser
        options:
          update:
            sql_update_contents:
              sql: DELETE FROM alluser;
                   INSERT INTO alluser SELECT GROUP_CONCAT(wsaccount, " ")
                   FROM (
                     SELECT wsaccount FROM usermap WHERE u_ts >= CAST(strftime('%s', 'now') AS INTEGER) - 86400
                     UNION
                     SELECT wsaccount FROM usermap_slurm
                     UNION
                     SELECT wsaccount FROM supportmap WHERE u_ts >= CAST(strftime('%s', 'now') AS INTEGER) - 86400
                     UNION
                     SELECT wsaccount FROM supportmap_slurm
                   ) WHERE wsaccount IS NOT NULL AND wsaccount != 'unknown';
        columns: 
          - { name: alluser,         type: extralongstr_t }

    - table:
        name: support
        options:
          update:
            sql_update_contents:
              sql: DELETE FROM support;
                   INSERT INTO support SELECT GROUP_CONCAT(wsaccount, " ") 
                   FROM (
                     SELECT wsaccount FROM supportmap WHERE u_ts >= CAST(strftime('%s', 'now') AS INTEGER) - 86400
                     UNION
                     SELECT wsaccount FROM supportmap_slurm
                   ) WHERE wsaccount IS NOT NULL AND wsaccount != 'unknown';
        columns: 
          - { name: support,         type: extralongstr_t }
          
    - table:
        name: mentorlist
        options:
          update:
            sql_update_contents:
              sql: DELETE FROM mentorlist;
                   INSERT INTO mentorlist (wsaccount,cnt,projects)
                   SELECT wsaccount, count(project), GROUP_CONCAT(project, ",") 
                   FROM mentormap 
                   WHERE u_ts >= CAST(strftime('%s', 'now') AS INTEGER) - 86400
                   GROUP by wsaccount;
        columns: 
          - { name: wsaccount,       type: name_t         }
          - { name: cnt,             type: count_t        }
          - { name: projects,        type: extralongstr_t }

    - table:
        name: rolelist
        options:
          update:
            sql_update_contents:
              sql: DELETE FROM rolelist;
                   INSERT INTO rolelist (fid,id,wsaccount,project,u_ts,kind)
                   SELECT 'U'||id||wsaccount||project, id, wsaccount, project, MAX(u_ts), 'U'
                   FROM (
                     SELECT id, wsaccount, project, u_ts FROM usermap WHERE u_ts >= CAST(strftime('%s', 'now') AS INTEGER) - 86400
                     UNION ALL
                     SELECT id, wsaccount, project, ts AS u_ts FROM usermap_slurm
                   ) GROUP BY id, wsaccount, project
                   UNION ALL
                   SELECT 'M'||id||wsaccount||project, id, wsaccount, project, MAX(u_ts), 'M'
                   FROM mentormap WHERE u_ts >= CAST(strftime('%s', 'now') AS INTEGER) - 86400
                   GROUP BY id, wsaccount, project
                   UNION ALL
                   SELECT kind||id||wsaccount||project, id, wsaccount, project, MAX(u_ts), kind
                   FROM pipamap WHERE u_ts >= CAST(strftime('%s', 'now') AS INTEGER) - 86400
                   GROUP BY id, wsaccount, project, kind
                   UNION ALL
                   SELECT "S"||id||wsaccount||"-all-", id, wsaccount, "-all-", MAX(u_ts), "S"
                   FROM (
                     SELECT id, wsaccount, u_ts FROM supportmap WHERE u_ts >= CAST(strftime('%s', 'now') AS INTEGER) - 86400
                     UNION ALL
                     SELECT id, wsaccount, ts AS u_ts FROM supportmap_slurm
                   ) GROUP BY id, wsaccount;       
        columns: 
          - { name: fid,             type: longstr_t      }
          - { name: id,              type: name_t         }
          - { name: wsaccount,       type: name_t         }
          - { name: project,         type: name_t         }
          - { name: u_ts,            type: ts_t           }
          - { name: kind,            type: shortstr_t     }
