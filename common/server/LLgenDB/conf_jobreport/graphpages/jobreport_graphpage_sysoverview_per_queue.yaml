- name: "Node_state_batch"
  xcol: "date"
  height: "550px"
  layout:
    %include "jobreport_graphpage_layout_range.yaml"
    annotations: 
      -   xref: "paper"
          yref: "paper"
          x: 1.0
          xanchor: "right"
          align: "right"
          y: 1.0
          yanchor: "bottom"
          text: "Current total number of nodes: #last_sum#"
          showarrow: false
    yaxis: 
        title: 
          text: "#nodes"
    legend:
        x: "0.0"
        xref: "x domain"
        xanchor: "left"
        y: "1"
        yanchor: "top"
    title:
        text: "<b>Number of nodes per state on the 'batch' queue</b>"
        font: 
          family: 'Arial'
          size: 16
        xref: "x domain"
        x:    "0.5"
        xanchor: "center"
  traces:
    - name:   "Nodes allocated and running jobs"
      ycol: "count"
      yaxis:  "y"
    #  mode:   "lines+markers"
    #  marker:
    #      size: 3
      color:  "#00B000"
      stackgroup: "sys"
      datapath: "data/_sysstat/sysstat_batchRu_span.csv"
    - name:   "Nodes planned (backfilling)"
      ycol: "count"
      yaxis:  "y"
      type:   "line"
      color:  "#00B0B0"
      stackgroup: "sys"
      datapath: "data/_sysstat/sysstat_batchPl_span.csv"
    - name:   "Nodes idle"
      ycol: "count"
      yaxis:  "y"
      type:   "line"
      color:  "#B0B000"
      stackgroup: "sys"
      datapath: "data/_sysstat/sysstat_batchId_span.csv"
    - name:   "Nodes idle powered down"
      ycol: "count"
      yaxis:  "y"
      type:   "line"
      color:  "#0000B0"
      stackgroup: "sys"
      datapath: "data/_sysstat/sysstat_batchPo_span.csv"
    - name:   "Reserved"
      ycol: "count"
      yaxis:  "y"
      type:   "line"
      color:  "#B0B0B0"
      stackgroup: "sys"
      datapath: "data/_sysstat/sysstat_batchRe_span.csv"
    - name:   "Nodes down"
      ycol: "count"
      yaxis:  "y"
      type:   "line"
      color:  "#B00000"
      stackgroup: "sys"
      datapath: "data/_sysstat/sysstat_batchDo_span.csv"
    - name:   "Unknown state"
      ycol: "count"
      yaxis:  "y"
      type:   "line"
      color:  "#B03000"
      stackgroup: "sys"
      datapath: "data/_sysstat/sysstat_batchUn_span.csv"


