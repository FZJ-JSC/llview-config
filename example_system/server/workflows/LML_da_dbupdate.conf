<LML_da_workflow>
  <vardefs>
    <var key="instdir"         value="${LLVIEW_HOME}/da" /> 
    <var key="LLVIEW_CONF"     value="${LLVIEW_CONF}"/>
    <!-- Common folders -->
    <var key="tmpdir"          value="./tmp"/>
    <var key="tmpcoldir"       value="./tmp/collect"/>
    <var key="tmpcntdir"       value="./tmp/cnt"/>
    <var key="lockfile"        value="./perm/collectdir.lock"/>
    <var key="tmpimportdir"    value="./tmp/import"/>
    <var key="permdir"         value="./perm"/>
    <var key="logdir"          value="./logs"/>
    <var key="archdir"         value="./arch"/>
    <var key="shareddir"       value="${LLVIEW_SHARED}/remote" />
    <!-- These variables are used by LML_da.pl -->
    <var key="signalfilename"  value="RUNNING_dbupdate"/>
    <!-- These variables are used by LML_da_par_step.pl -->
    <var key="steptimingfile"  value="./tmp/step_timing_dbupdate_new.xml" />
    <var key="name"            value="DBupdate" />
    <var key="stepcounter"     value="./tmp/cnt/stepcounter_dbupdate.dat" />
    <var key="stepcountersave" value="./tmp/cnt/stepcounter_dbupdate_save.dat" />
    <var key="tmplmlarchdir"   value="./tmp/lmlarch"/>
    <!-- Variables used below -->
    <var key="perl"            value="perl" />
    <var key="PYTHON"          value="${PYTHON}" />
    <var key="instdir_old"     value="${HOME}/llview/da" /> 
    <var key="workflowdir"     value="${LLVIEW_CONF}/server/workflows"/>
  </vardefs>

  <step active="1" id="start" exec_after="" type="execute">
    <cmd exec="echo 'starting LML_da_dbupdate.conf'"/>
    <cmd exec="cp $stepcounter $stepcountersave" />
  </step>

  <!-- ------------------------------------------- -->
  <!--   copy data collected by collect workflow   -->
  <!-- ------------------------------------------- -->

  <step active="1" id="cpdatadbupdate" exec_after="start" type="execute">
    <cmd  exec="$instdir/utils/da_lock.pl --verbose --debug --lockfile=$lockfile set" />
    <cmd  exec="mkdir -p $tmpimportdir" />
    <cmd  exec="shopt -s nullglob && mv $tmpcoldir/*.xml $tmpimportdir;" />
    <cmd  exec="$instdir/utils/da_lock.pl --verbose --debug --lockfile=$lockfile release" />
  </step>

  <!-- ------------------------------------------- -->
  <!--   import data in DB                         -->
  <!-- ------------------------------------------- -->
  <!--  removed $tmpimportdir/step_timing_jufo_LML.xml --> 
  <!--  removed $tmpimportdir/io_out_l.xml --> 
  <step active="1" id="LMLDBupdate" exec_after="cpdatadbupdate" type="execute">
    <!-- Adding trigger XML file to be used by databases that may not be always updated -->
    <cmd exec="$PYTHON $instdir/utils/trigger.py --xml $tmpimportdir/trigger.xml"/> 
    <cmd  exec="$perl $instdir/LML_DBupdate/LML_DBupdate.pl --dbdir=$permdir/db/
                                                            --config $LLVIEW_CONF/server/LLgenDB/LLgenDB.yaml
                                                            --updatealways='reservation,classes,reasons,nodeerr'
                                                            --maxprocesses 20
                                                            $tmpimportdir/sysinfo_LML.xml 
                                                            $tmpimportdir/nodes_LML.xml 
                                                            $tmpimportdir/jobs_LML.xml
                                                            $tmpimportdir/reservation_LML.xml 
                                                            $tmpimportdir/classes_LML.xml 
                                                            $tmpimportdir/nodereasons_LML.xml 
                                                            $tmpimportdir/jobs_step_LML.xml
                                                            $tmpimportdir/nodepower_LML.xml 
                                                            $tmpimportdir/icnodemap.xml
                                                            $tmpimportdir/gpus_LML.xml
						                                                $tmpimportdir/cores_LML.xml
                      					                            $tmpimportdir/cores.percore_LML.xml
                                                            $tmpimportdir/ibms_LML.xml 
                                                            $tmpimportdir/login_*.xml
                                                            $tmpimportdir/accountmap.xml
                                                            $tmpimportdir/LMLDBstat.xml 
                                                            $tmpimportdir/jobs_errmsg_HC_LML.xml 
                                                            $tmpimportdir/nodes_errmsg_HC_LML.xml
                                                            $tmpimportdir/trigger.xml
                                                            $tmpimportdir/step_timing_collect_LML.xml 
                                                            $tmpimportdir/step_timing_dbupdate_LML*.xml 
                                                            $tmpimportdir/step_timing_lmlarch_LML.xml 
                                                            $tmpimportdir/step_timing_jobreport_LML.xml 
                                                            $tmpimportdir/step_timing_lmlstat_LML.xml 
                                                            $tmpimportdir/LMLDBupdate_stat_LML.xml 
                                                            $tmpimportdir/LL_jobreport_stat_LML.xml 
                                                            $tmpimportdir/transferreports_stat_LML.xml
                                                            "/>
  </step>

  <!-- STEP: Analyse timings of individual steps of DBupdate -->
  <step active="1" id="LMLDBupdatestat" exec_after="LMLDBupdate"  type="execute">
    <cmd  exec="$perl $instdir/LML_DBupdate/LML_analyse_DBupdate.pl -v 
                                                                    -name DBuInt
                                                                    -cntfile=$stepcountersave
                                                                    -infile $logdir/steps/LMLDBupdate_last.log 
                                                                    -outfile $tmpdir/LMLDBupdate_stat_LML_new.xml
                                                                    -outfileascii $tmpcoldir/LMLDBupdate_stat.dat
                                                                    "/>
  </step>

  <!-- --------------------------------------- -->
  <!--   update DB stat info                   -->
  <!-- --------------------------------------- -->
  <!-- Getting information about all db tables -->
  <step active="1" id="LMLDBstat" exec_after="LMLDBupdate" type="execute">
    <cmd  exec="$perl $instdir/utils/exec_every_n_step_or_empty.pl $permdir/stepcount_LMLDBstat.dat 
                                                                    5 
                                                                    $instdir/utils/empty_LML.xml 
                                                                    $tmpdir/LMLDBstat.xml
                                                                    $perl $instdir/LML_DBupdate/LML_DBstat.pl -v 
                                                                                                              --dbdir=$permdir/db/
                                                                                                              --tmpdir=$tmpdir/
                                                                                                              --config $LLVIEW_CONF/server/LLgenDB/LLgenDB.yaml
                                                                                                              --maxprocesses 16
                                                                                                              --lmlfile $tmpdir/LMLDBstat_new.xml
                                                                                                              "/>
  </step>

  <!-- --------------------------------------- -->
  <!--   trigger jobreport step                -->
  <!-- --------------------------------------- -->
  <step active="1" id="trigger_JobRep" exec_after="LMLDBstat" type="execute">
    <cmd exec="cp $stepcountersave $tmpcntdir/stepcounter_jobreport.dat" />
    <cmd exec="touch $permdir/jobreport_start.ready"/> <!-- signal to start Job Report action (next part of workflow) -->
    <cmd exec="cp $stepcountersave $tmpcntdir/stepcounter_lmlstat.dat" />
    <cmd exec="touch $permdir/lmlstat_start.ready"/> <!-- signal to start Live View action (next part of workflow) -->
  </step>

  <!-- --------------------------------------- -->
  <!--   archive old data from database        -->
  <!-- --------------------------------------- -->
  <step active="1" id="LMLDBarch" exec_after="LMLDBstat" type="execute">
    <cmd  exec="$perl $instdir/LML_DBupdate/LML_DBarch.pl --dbdir=$permdir/db/
                                                          --archdir=$archdir/db/
                                                          --dblist=jobstate,jobstep,loadmemstate,fsusagestate_all,fsusagestate_project,fsusagestate_scratch,fsusagestate_fastdata,fsusagestate_home,fabricstate,gpustate,sysstatstate,nodeerr,steptimings,DBstat,transfer,pcpucoresstate,powerstate
                                                          --config $LLVIEW_CONF/server/LLgenDB/LLgenDB.yaml
                                                          --maxprocesses 20
                                                          "/>
  </step>

</LML_da_workflow>
