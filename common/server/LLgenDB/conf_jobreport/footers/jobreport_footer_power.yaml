#############
# Footer NODE
#############
- footersetelem:
    name: "Power"
    info: "Job: #JobID#"
    graphs: 
       - graph:
            name: "NodePower"
            xcol: "date"
            layout:
              yaxis: 
                  title: 
                    text: "Node Power (W)"
            datapath: "data/projects/#Project#/#Owner#/Nodepower_#JobID#.csv"
            traces:
              - trace:
                  name:   "Node Power"
                  ycol: "power"
                  yaxis:  "y"
                  type:   "scatter"
                  color:  "#0000A0"
