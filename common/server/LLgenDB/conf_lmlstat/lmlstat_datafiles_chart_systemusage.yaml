- chart:
   name:     'system_usage'
   x-axes:
      type: 'linear'
      unit: 'min'
      min: '0'
      max: '1439'
      ticcount: '1440'
      # dist: 'equalnum'
      labels:
        - { pos: '0',        text: "- 24 h"  }
        - { pos: '120',      text: "- 22 h"  }
        - { pos: '240',      text: "- 20 h"  }
        - { pos: '360',      text: "- 18 h"  }
        - { pos: '480',      text: "- 16 h"  }
        - { pos: '600',      text: "- 14 h"  }
        - { pos: '720',      text: "- 12 h"  }
        - { pos: '840',      text: "- 10 h"  }
        - { pos: '960',      text: "-  8 h"  }
        - { pos: '1080',     text: "-  6 h"  }
        - { pos: '1200',     text: "-  4 h"  }
        - { pos: '1320',     text: "-  2 h"  }
        - { pos: '1439',     text: "now"  }
   y-axes:
      type: 'linear'
      unit: 'nodes'
      min: '0'
      max: '6250'
      ticcount: '25'
   traces:
      - trace:
        name: 'Unknown'
        data_database:       'loadmemstate'
        data_table:          'loadmem_aggr_by_ts_feat_status'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,count as y
             FROM loadmem_aggr_by_ts_feat_status
             WHERE x>=0 AND substatus='ALL' AND feat='ALL' AND status='Un'
             ORDER BY x
      - trace:
        name: 'Down'
        data_database:       'loadmemstate'
        data_table:          'loadmem_aggr_by_ts_feat_status'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,count as y
             FROM loadmem_aggr_by_ts_feat_status
             WHERE x>=0 AND substatus='ALL' AND feat='ALL' AND status='Do'
             ORDER BY x
      - trace:
        name: 'Reserved'
        data_database:       'loadmemstate'
        data_table:          'loadmem_aggr_by_ts_feat_status'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,count as y
             FROM loadmem_aggr_by_ts_feat_status
             WHERE x>=0 AND substatus='ALL' AND feat='ALL' AND status='Re'
             ORDER BY x
      - trace:
        name: 'IdlePoweredDown'
        data_database:       'loadmemstate'
        data_table:          'loadmem_aggr_by_ts_feat_status'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,count as y
             FROM loadmem_aggr_by_ts_feat_status
             WHERE x>=0 AND substatus='ALL' AND feat='ALL' AND status='Po'
             ORDER BY x
      - trace:
        name: 'Idle'
        data_database:       'loadmemstate'
        data_table:          'loadmem_aggr_by_ts_feat_status'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,count as y
             FROM loadmem_aggr_by_ts_feat_status
             WHERE x>=0 AND substatus='ALL' AND feat='ALL' AND status='Id'
             ORDER BY x
      - trace:
        name: 'Planned'
        data_database:       'loadmemstate'
        data_table:          'loadmem_aggr_by_ts_feat_status'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,count as y
             FROM loadmem_aggr_by_ts_feat_status
             WHERE x>=0 AND substatus='ALL' AND feat='ALL' AND status='Pl'
             ORDER BY x
      - trace:
        name: 'Running'
        data_database:       'loadmemstate'
        data_table:          'loadmem_aggr_by_ts_feat_status'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,count as y
             FROM loadmem_aggr_by_ts_feat_status
             WHERE x>=0 AND substatus='ALL' AND feat='ALL' AND status='Ru'
             ORDER BY x

- chart:
   name:     'system_gpuusage'
   x-axes:
      type: 'linear'
      unit: 'min'
      min: '0'
      max: '1439'
      ticcount: '1440'
      # dist: 'equalnum'
      labels:
        - { pos: '0',        text: "- 24 h"  }
        - { pos: '120',      text: "- 22 h"  }
        - { pos: '240',      text: "- 20 h"  }
        - { pos: '360',      text: "- 18 h"  }
        - { pos: '480',      text: "- 16 h"  }
        - { pos: '600',      text: "- 14 h"  }
        - { pos: '720',      text: "- 12 h"  }
        - { pos: '840',      text: "- 10 h"  }
        - { pos: '960',      text: "-  8 h"  }
        - { pos: '1080',     text: "-  6 h"  }
        - { pos: '1200',     text: "-  4 h"  }
        - { pos: '1320',     text: "-  2 h"  }
        - { pos: '1439',     text: "now"  }
   y-axes:
      type: 'linear'
      unit: 'nodes'
      min: '0'
      max: '100'
      ticcount: '11'
   traces:
      - trace:
        name: 'GPU_Usage'
        data_database:       'gpustate'
        data_table:          'gpu_aggr_by_ts'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,gpu_util_avg as y
             FROM gpu_aggr_by_ts
             WHERE x>=0
             ORDER BY x
             
