- dataset:
    name: template_reservationlist
    set: template
    filepath: '$outputdir/LLtemplates/reservationlist.handlebars'
    stat_database: jobreport_json_stat
    stat_table: datasetstat_templates
    format: 'datatable'
    ag-grid-theme: 'balham'
    columns:
      - {
            field: "resname",
            headerName: "Reservation Name",
            headerTooltip: "Name of the reservation",
            cellDataType: "text",
            cellClass: "text-left",
            flex: 2,
            pinned: 'left'
        }
      - {
          headerName: "General Info",
          groupId: "Info",
          children: [
            {
              field: "state",
              headerName: "State",
              headerTooltip: "State of the reservation",
              cellDataType: "text",
              cellClass: "text-left",
              minWidth: 90,
            },
            {
              field: "flags",
              headerName: "Flags",
              headerTooltip: "Flags used in the reservation",
              cellDataType: "text",
              cellClass: "text-left",
              minWidth: 100,
            },
          ]
        }
      - {
          headerName: "Scheduler",
          groupId: "Scheduler",
          children: [
            {
              field: "startts",
              headerName: "Start Date",
              headerTooltip: "Start date of reservation",
              cellDataType: "dateString",
              filter: "DateTimeParentFilter",
              floatingFilterComponent: "DateFloatingFilterComponent",
              minWidth: 140,
            },
            {
              field: "endts",
              headerName: "End Date",
              headerTooltip: "End date of the reservation",
              cellDataType: "dateString",
              filter: "DateTimeParentFilter",
              floatingFilterComponent: "DateFloatingFilterComponent",
              minWidth: 140,
            },
            {
              field: "wall",
              headerName: "Walltime",
              headerTooltip: "Walltime of reservation",
              cellDataType: "text",
              minWidth: 100,
            },
          ]
        }
      - {
          headerName: "Resources",
          groupId: "Resources",
          children: [
            {
              field: "numnodes",
              headerName: "#Nodes",
              headerTooltip: "Number of nodes in the reservation",
              cellDataType: "number",
              minWidth: 90,
            },
            {
              field: "numcores",
              headerName: "#Cores",
              headerTooltip: "Number of cores in the reservation",
              cellDataType: "number",
              minWidth: 90,
            },
          ]
        }
      - {
          field: "nodelist",
          headerName: "Node List",
          headerTooltip: "Nodes covered by the reservation",
          cellDataType: "text",
          cellClass: "text-left",
          wrapText: true,
          autoHeight: true,
          flex: 2,
          minWidth: 200,
        }
      - {
          field: "accounts",
          headerName: "Accounts",
          headerTooltip: "Accounts allowed to submit jobs to the reservation",
          cellDataType: "text",
          cellClass: "text-left",
          wrapText: true,
          autoHeight: true,
          flex: 2,
          minWidth: 150,
        }

- dataset:
    name: template_nodereasons
    set: template
    filepath: '$outputdir/LLtemplates/nodereasons.handlebars'
