- dataset:
    name: sysallrackenghour_csv
    set:        rackenergy
    filepath:   '$outputdir/_sysstat/sysrackeng_allracks_hour.csv'
    columns:        'ts,day,ts_delta,energy_sum'
    header:         'date,day,tdeltam,energy_sum'
    column_convert: 'ts->todate_1,ts_delta->minutefrac'
    format_str:      '%s,%s,%.2f,%.4f'
    column_ts:      'ts'
    format:         'csv'
    renew:          'always'
#    renew:          'daily(14:00)'
    data_database:   powerstate
    data_table:      rackenergy_aggr_by_hour
    stat_database:   jobreport_stat_rackenergy
    stat_table:      datasetstat_csv


