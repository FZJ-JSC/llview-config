#---------------------------
# table, filled by LML input
#---------------------------
- table:
    name: chippower_import
    options:
      update:
        LML: pwrinfo
        mode: replace
      update_trigger:
        - chippower
        - chippower_aggr_by_ts
#       - chippower_aggr_by_node
        - chippower_current_jobid
        - chippower_jobmap_by_nd_minmaxts
        - chippower_by_jobid_nodeid_chipid_ts
        - chippower_aggr_by_jobid_nodeid_chipid
        - chippower_aggr_by_jobid_ts
        - chippower_aggr_by_jobid
        - currentjobs_chiplist
        - currentjobs_chipspec
      archive:
        limit: max(ts)-25h
      index: nodeid,chipid,ts
    columns: 
      - { name: nodeid,           type: nodeid_t,   LML_from: pid,              LML_default: 'unknown' }
      - { name: chipid,           type: nodeid_t,   LML_from: id,               LML_default: 'unknown' }
      - { name: ts,               type: ts_t,       LML_from: pwr_ts,           LML_default: -1,  LML_minlastinsert: mintsinserted }
      - { name: features,         type: feature_t,  LML_from: features,         LML_default: 0 }
      - { name: gpu_pu,           type: float_t,    LML_from: gpu_pu,           LML_default: 0 }
      - { name: power,            type: float_t,    LML_from: power,            LML_default: 0 }
      - { name: cpupower,         type: float_t,    LML_from: cpupower,         LML_default: 0 }
      - { name: cpupowercap,      type: float_t,    LML_from: cpupowercap,      LML_default: 0 }

#---------------------------
# table, all nodes at a ts
#---------------------------
- table:
    name: chippower
    options:
      update:
        sql_update_contents:
          vars: mintsinserted
          sql: DELETE FROM chippower WHERE (ts >= mintsinserted);
               INSERT INTO chippower (chipid,nodeid,ts,gpu_pu,power,cpupower,cpupowercap)
                      SELECT ni.nodeid||"_00",ni.nodeid,dt.ts,0.0,0.0,0.0,0.0
                      FROM nodeinfo ni, (SELECT DISTINCT ts FROM chippower_import) dt
                      WHERE ni.nodeid NOT IN (SELECT nodeid FROM chippower_import);
               INSERT INTO chippower (chipid,nodeid,ts,gpu_pu,power,cpupower,cpupowercap)
                      SELECT ni.nodeid||"_01",ni.nodeid,dt.ts,0.0,0.0,0.0,0.0
                      FROM nodeinfo ni, (SELECT DISTINCT ts FROM chippower_import) dt
                      WHERE ni.nodeid NOT IN (SELECT nodeid FROM chippower_import);
               INSERT INTO chippower (chipid,nodeid,ts,gpu_pu,power,cpupower,cpupowercap)
                      SELECT ni.nodeid||"_02",ni.nodeid,dt.ts,0.0,0.0,0.0,0.0
                      FROM nodeinfo ni, (SELECT DISTINCT ts FROM chippower_import) dt
                      WHERE ni.nodeid NOT IN (SELECT nodeid FROM chippower_import);
               INSERT INTO chippower (chipid,nodeid,ts,gpu_pu,power,cpupower,cpupowercap)
                      SELECT ni.nodeid||"_03",ni.nodeid,dt.ts,0.0,0.0,0.0,0.0
                      FROM nodeinfo ni, (SELECT DISTINCT ts FROM chippower_import) dt
                      WHERE ni.nodeid NOT IN (SELECT nodeid FROM chippower_import);
               INSERT INTO chippower (chipid,nodeid,ts,gpu_pu,power,cpupower,cpupowercap)
                      SELECT chipid,nodeid,ts,gpu_pu,power,cpupower,cpupowercap
                      FROM chippower_import
                      WHERE power!="None";

      archive:
        limit: max(ts)-25h
      # This prevents duplicates
      unique_index: nodeid,chipid,ts
      # This creates a standard index for fast queries by time
      index: ts
    columns: 
      - { name: nodeid,           type: nodeid_t  }
      - { name: chipid,           type: nodeid_t  }
      - { name: ts,               type: ts_t      }
      - { name: gpu_pu,           type: float_t   }
      - { name: power,            type: float_t   }
      - { name: cpupower,         type: float_t   }
      - { name: cpupowercap,      type: float_t   }


#-------------------------------
# tables, containing per ts info
#-------------------------------
- table:
    name: chippower_aggr_by_ts
    options:
      update:
        sql_update_contents:
          vars: mintsinserted
          sql: DELETE FROM chippower_aggr_by_ts WHERE (ts >= mintsinserted);
               DELETE FROM chippower_aggr_by_ts WHERE (ts < mintsinserted - 25*3600);
               INSERT INTO chippower_aggr_by_ts
                                 (ts, cnt,
                                  gpu_pu_avg, gpu_pu_min, gpu_pu_max,
                                  power_avg, power_min, power_max,
                                  cpupower_avg, cpupower_min, cpupower_max,
                                  cpupowercap_avg, cpupowercap_min, cpupowercap_max
                                  )
                                              SELECT ts, COUNT(ts),
                                                     AVG(gpu_pu),     MIN(gpu_pu),     MAX(gpu_pu),
                                                     AVG(power),      MIN(power),      MAX(power),
                                                     AVG(cpupower),   MIN(cpupower),   MAX(cpupower),
                                                     AVG(cpupowercap),MIN(cpupowercap),MAX(cpupowercap)
                                              FROM chippower WHERE (ts >= mintsinserted)
                                              GROUP by ts
    columns: 
      - { name: ts,                   type: ts_t }
      - { name: cnt,                  type: int_t }
      - { name: gpu_pu_avg,           type: float_t }
      - { name: gpu_pu_min,           type: float_t }
      - { name: gpu_pu_max,           type: float_t }
      - { name: power_avg,            type: float_t }
      - { name: power_min,            type: float_t }
      - { name: power_max,            type: float_t }
      - { name: cpupower_avg,         type: float_t }
      - { name: cpupower_min,         type: float_t }
      - { name: cpupower_max,         type: float_t }
      - { name: cpupowercap_avg,      type: float_t }
      - { name: cpupowercap_min,      type: float_t }
      - { name: cpupowercap_max,      type: float_t }


#-----------------------------------
# tables, containing per nodeid info
#-----------------------------------
- table:
    name: chippower_aggr_by_node
    options:
      update:
        # updates only a subset of nodes in one step (full turn in 15 steps)
        sql_update_contents:
          sqldebug: 0
          sql: DELETE FROM chippower_aggr_by_node
                      WHERE nodeid IN (
                                   SELECT nodeid FROM nodeinfo, node_update_status
                                   WHERE nid%update_step_max=update_step and step_id=1
                                   );
               INSERT INTO chippower_aggr_by_node
                                   (nodeid, cnt,
                                   gpu_pu_avg, gpu_pu_min, gpu_pu_max,
                                   power_avg, power_min, power_max,
                                   cpupower_avg, cpupower_min, cpupower_max,
                                   cpupowercap_avg, cpupowercap_min, cpupowercap_max,
                                   ts_min, ts_max)
                                               SELECT nodeid, COUNT(ts),
                                                     AVG(gpu_pu),     MIN(gpu_pu),     MAX(gpu_pu),
                                                     AVG(power),      MIN(power),      MAX(power),
                                                     AVG(cpupower),   MIN(cpupower),   MAX(cpupower),
                                                     AVG(cpupowercap),MIN(cpupowercap),MAX(cpupowercap),
                                                     MIN(ts),   MAX(ts)
                                               FROM chippower 
                                               WHERE nodeid IN (
                                                     SELECT nodeid FROM nodeinfo, node_update_status
                                                     WHERE nid%update_step_max=update_step and step_id=1
                                                     )
                                               GROUP by nodeid
    columns: 
      - { name: nodeid,               type: nodeid_t }
      - { name: cnt,                  type: int_t }
      - { name: gpu_pu_avg,           type: float_t }
      - { name: gpu_pu_min,           type: float_t }
      - { name: gpu_pu_max,           type: float_t }
      - { name: power_avg,            type: float_t }
      - { name: power_min,            type: float_t }
      - { name: power_max,            type: float_t }
      - { name: cpupower_avg,         type: float_t }
      - { name: cpupower_min,         type: float_t }
      - { name: cpupower_max,         type: float_t }
      - { name: cpupowercap_avg,      type: float_t }
      - { name: cpupowercap_min,      type: float_t }
      - { name: cpupowercap_max,      type: float_t }
      - { name: ts_min,               type: ts_t }
      - { name: ts_max,               type: ts_t }

#----------------------------------
# tables, containing per jobid info
#----------------------------------
- table:
    name: chippower_by_jobid_nodeid_chipid_ts
    options:
      update:
        sql_update_contents:
          sqldebug: 0
          vars: mintsinserted
          sql: DELETE FROM chippower_by_jobid_nodeid_chipid_ts WHERE (ts >= mintsinserted);
               INSERT INTO chippower_by_jobid_nodeid_chipid_ts
                          (jobid,ts,nodeid,chipid,gpu_pu,power,cpupower,cpupowercap)
                          SELECT jnt.jobid, pwr.ts, pwr.nodeid, pwr.chipid,
                                 pwr.gpu_pu, pwr.power, pwr.cpupower, pwr.cpupowercap 
                           FROM chippower_jobmap_by_nd_minmaxts jnt,
                                chippower pwr
                           WHERE  (pwr.ts >= mintsinserted) 
                              AND (jnt.nodeid=pwr.nodeid) AND (pwr.ts <= jnt.maxts+59)
      archive:
        limit: max(ts)-25h
      unique_index: jobid,nodeid,chipid,ts
      index: ts
    columns: 
      - { name: jobid,            type: jobid_t   }
      - { name: ts,               type: ts_t      }
      - { name: nodeid,           type: nodeid_t  }
      - { name: chipid,           type: nodeid_t  }
      - { name: gpu_pu,           type: float_t   }
      - { name: power,            type: float_t   }
      - { name: cpupower,         type: float_t   }
      - { name: cpupowercap,      type: float_t   }

- table:
    name: chippower_aggr_by_jobid_ts
    options:
      update:
        sql_update_contents:
          sqldebug: 0
          vars: mintsinserted
          sql: DELETE FROM chippower_aggr_by_jobid_ts WHERE (ts >= mintsinserted);
               INSERT INTO chippower_aggr_by_jobid_ts
                 (jobid,ts,cnt,
                  gpu_pu_avg, gpu_pu_min, gpu_pu_max,
                  power_avg, power_min, power_max,
                  cpupower_avg, cpupower_min, cpupower_max,
                  cpupowercap_avg, cpupowercap_min, cpupowercap_max)
                    SELECT jobid,
                           ts,
                           COUNT(power),
                           AVG(gpu_pu),     MIN(gpu_pu),     MAX(gpu_pu),
                           AVG(power),      MIN(power),      MAX(power),
                           AVG(cpupower),   MIN(cpupower),   MAX(cpupower),
                           AVG(cpupowercap),MIN(cpupowercap),MAX(cpupowercap)
                           FROM chippower_by_jobid_nodeid_chipid_ts
                           WHERE (ts >= mintsinserted)
                           GROUP by jobid,ts;
      archive:
        limit: max(ts)-25h
    columns: 
      - { name: jobid,           type: jobid_t }
      - { name: ts,              type: ts_t    }
      - { name: cnt,             type: int_t }
      - { name: gpu_pu_avg,      type: float_t }
      - { name: gpu_pu_min,      type: float_t }
      - { name: gpu_pu_max,      type: float_t }
      - { name: power_avg,       type: float_t }
      - { name: power_min,       type: float_t }
      - { name: power_max,       type: float_t }
      - { name: cpupower_avg,    type: float_t }
      - { name: cpupower_min,    type: float_t }
      - { name: cpupower_max,    type: float_t }
      - { name: cpupowercap_avg, type: float_t }
      - { name: cpupowercap_min, type: float_t }
      - { name: cpupowercap_max, type: float_t }

- table:
