- dataset:
    name: template_memheatmap
    set: template
    filepath: '$outputdir/LLtemplates/memheatmap.handlebars'
    stat_database: jobreport_json_stat
    stat_table: datasetstat_templates
    format: 'datatable'
    ag-grid-theme: 'balham'
    columns:
      # The primary memory class identifier is pinned to the left so it remains visible while scrolling horizontally
      - {
          field: "memcls",
          headerName: "Memory Class",
          headerTooltip: "Memory usage up to xx GB",
          cellDataType: "text",
          pinned: "left",
          sortable: false,
          minWidth: 110,
        }
      # The heatmap columns are generated uniformly without grouping. 
      # Percentage formatters and specific color scales are applied directly to each cell.
      - { field: "n_1",    sortable: false, headerName: "N_1", headerTooltip: "Percentage used by jobs of size 1", cellDataType: "number", valueFormatter: "(params) => percent_or_null(params)", cellStyle: "(params) => cell_background_color(params, 'n_1', 'RdYlGn')", minWidth: 70 }
      - { field: "n_2",    sortable: false, headerName: "N_2", headerTooltip: "Percentage used by jobs of size 2", cellDataType: "number", valueFormatter: "(params) => percent_or_null(params)", cellStyle: "(params) => cell_background_color(params, 'n_2', 'RdYlGn')", minWidth: 70 }
      - { field: "n_3",    sortable: false, headerName: "N_3", headerTooltip: "Percentage used by jobs of size 3", cellDataType: "number", valueFormatter: "(params) => percent_or_null(params)", cellStyle: "(params) => cell_background_color(params, 'n_3', 'RdYlGn')", minWidth: 70 }
