- dataset:
    name: template_nodeerr
    set: template
    filepath: '$outputdir/LLtemplates/nodeerr.handlebars'
    stat_database: jobreport_json_stat
    stat_table: datasetstat_templates
    format: 'datatable'
    ag-grid-theme: 'balham'
    columns:
      # Critical identifiers are kept strictly visible at the top level
      - { 
          field: "nodeerrts",
          headerName: "Date",
          headerTooltip: "Date error was issued",
          cellDataType: "dateString",
          filter: "DateTimeParentFilter",
          floatingFilterComponent: "DateFloatingFilterComponent",
          maxWidth: 140,
        }
      - { 
          field: "nodeid",
          headerName: "Node",
          headerTooltip: "Node where error was issued",
          cellDataType: "text",
          maxWidth: 100,
        }
      - { 
          field: "jobid",
          headerName: "JobID",
          headerTooltip: "JobID",
          cellDataType: "text",
          cellRenderer: "(params) => gen_search_jobid_link(params)",
          maxWidth: 100,
        }
      
      # Process context details are grouped for a clean default view
      - {
          headerName: "Process Info",
          groupId: "ProcInfo",
          children: [
            { 
              field: "cmd",
              headerName: "Command",
              headerTooltip: "Command that issued error",
              cellDataType: "text",
              maxWidth: 120,
            },
            { 
              field: "pid",
              headerName: "PID",
              headerTooltip: "ProcessID that issued error",
              cellDataType: "number",
              maxWidth: 90,
            },
            { 
              field: "user",
              headerName: "User",
              headerTooltip: "User",
              cellDataType: "text",
              maxWidth: 100,
            },
          ]
        }
      # Extended metadata is grouped and hidden by default to keep the main table clean
      - {
          headerName: "Extended Info",
          groupId: "ExtInfo",
          children: [
            { 
              field: "msgcls",
              headerName: "Message Class",
              headerTooltip: "Error Message Class",
              cellDataType: "number",
              columnGroupShow: "closed",
              minWidth: 130,
            },
            { 
              field: "uid",
              headerName: "UID",
              headerTooltip: "UserID",
              cellDataType: "number",
              columnGroupShow: "closed",
              maxWidth: 70,
            },
            { 
              field: "gid",
              headerName: "GID",
              headerTooltip: "GroupID",
              cellDataType: "number",
              columnGroupShow: "closed",
              maxWidth: 70,
            },
          ]
        }
      # The actual error message is given high flex and wrapText to gracefully handle long logs
      - { 
          field: "msg",
          headerName: "Message",
          headerTooltip: "Error Message",
          cellDataType: "text",
          cellClass: "text-left",
          wrapText: true,
          autoHeight: true,
          flex: 3,
          minWidth: 400,
        }
      
