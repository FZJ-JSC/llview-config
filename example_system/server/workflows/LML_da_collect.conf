<LML_da_workflow>
  <vardefs>
    <var key="instdir"           value="${LLVIEW_HOME}/da" /> 
    <var key="LLVIEW_CONF"       value="${LLVIEW_CONF}"/>
    <!-- Common folders -->
    <var key="tmpdir"            value="./tmp"/>
    <var key="tmpcoldir"         value="./tmp/collect"/>
    <var key="tmpcntdir"         value="./tmp/cnt"/>
    <var key="lockfile"          value="./perm/collectdir.lock"/>
    <var key="permdir"           value="./perm"/>
    <var key="logdir"            value="./logs"/>
    <var key="archdir"           value="./arch"/>
    <var key="shareddir"         value="${LLVIEW_SHARED}/remote" />
    <var key="sharedcollectdir"  value="${LLVIEW_SHARED}/collect" />
    <!-- These variables are used by LML_da.pl -->
    <var key="signalfilename"    value="RUNNING_collectb"/>
    <!-- These variables are used by LML_da_par_step.pl -->
    <var key="steptimingfile"    value="./tmp/step_timing_collect_new.xml" />
    <var key="name"              value="Collect" />
    <var key="stepcounterbase"   value="./perm/stepcounter.dat" />
    <var key="stepcounter"       value="./tmp/cnt/stepcounter_collect.dat" />
    <var key="stepcountersave"   value="./tmp/cnt/stepcounter_collect_save.dat" />
    <var key="tmplmlarchdir"     value="./tmp/lmlarch"/>
    <!-- Variables used below -->
    <var key="perl"              value="perl" />
    <var key="PYTHON"            value="${PYTHON}" />
    <var key="instdir_old"       value="${HOME}/llview/da" /> 
    <var key="workflowdir"       value="${LLVIEW_CONF}/server/workflows"/>
  </vardefs>

  <step active="1" id="start" exec_after="" type="execute">
    <cmd exec="echo 'starting LML_da_collect.conf'"/>
    <cmd exec="cp $stepcounter $stepcountersave | true" />
    <cmd exec="mkdir -p \$(dirname $stepcounter) && cp $stepcounterbase $stepcounter | true" />
    <cmd exec="$perl $instdir/utils/increase_counter.pl $stepcounterbase"/>
  </step>

  <!-- --------------------------------------- -->
  <!--   copy data produced by remote system   -->
  <!-- --------------------------------------- -->

  <step active="1" id="initcoldir" exec_after="start" type="execute">
    <cmd  exec="$instdir/utils/da_lock.pl --verbose --debug --lockfile=$lockfile set" />
    <cmd  exec="rm -f $tmpcoldir/*.xml 2>/dev/null" />
  </step>

  <step active="1" id="cpdataremote" exec_after="initcoldir" type="execute">
    <cmd  exec="mkdir -p $tmpcoldir" />
    <cmd  exec="cp -p $shareddir/sysinfo_LML.xml       $tmpcoldir;
                cp -p $shareddir/nodes_LML.xml         $tmpcoldir; 
                cp -p $shareddir/jobs_LML.xml          $tmpcoldir;
                cp -p $shareddir/reservation_LML.xml   $tmpcoldir;
                cp -p $shareddir/classes_LML.xml       $tmpcoldir; 
                cp -p $shareddir/nodereasons_LML.xml   $tmpcoldir; 
                cp -p $shareddir/jobs_step_LML.xml     $tmpcoldir;
                cp -p $shareddir/slurmaccounts_LML.xml $tmpcoldir;
                cp -p $shareddir/nodepower_LML.xml     $tmpcoldir;
                cp -p /{p,e}/hpcmon/*/llstat/remote/login_*.xml  $tmpcoldir;" />
  </step>

  <!-- ---------------------------------------------------- -->
  <!--   collect data from daemons and other local sources  -->
  <!-- ---------------------------------------------------- -->

  <!--   STEP: plugin for information from Prometheus:  All queries   -->
  <step active="0" id="da_promet" exec_after="initcoldir" type="execute">
    <cmd exec="$PYTHON $instdir/rms/GenericAPI/generic_api.py --config $LLVIEW_CONF/plugins/promet.yml
                                                                                      --outfolder $tmpcoldir
                                                                                      "/>
  </step>


  <!--   STEP: plugin for information from Healthchecker log files   -->
  <step active="0" id="da_errmsg" exec_after="start" type="execute">
    <cmd exec="$PYTHON $instdir/rms/files/files.py --config $LLVIEW_CONF/plugins/healthchecker.yml
                                                                                      --outfolder $tmpcoldir
                                                                                      "/>
  </step>

  <!--   STEP: copying interconnect mapping generated by icmap action   -->
  <step active="1" id="da_icmap" exec_after="initcoldir" type="execute">
    <cmd  exec="$perl $instdir/utils/cp_if_newer_or_empty.pl  
                      $tmpdir/icnodemap_new.xml   
                      $tmpdir/icnodemap.xml
                      $tmpdir/icnodemap_done.xml   
                      $instdir/utils/empty_LML.xml"/>
    <cmd  exec="cp -p $tmpdir/icnodemap_new.xml $tmpdir/icnodemap_done.xml"/>
    <cmd  exec="cp -p $tmpdir/icnodemap.xml $tmpcoldir"/>
  </step>

  <!--   STEP: plugin for environment information from checkMK   -->
  <step active="0" id="da_checkmk" exec_after="start" type="execute">
    <cmd exec="$PYTHON $instdir/rms/GenericAPI/generic_api.py --config $LLVIEW_CONF/plugins/checkmk.yml
                                                                          --outfolder $tmpdir
                                                                          "/>
  </step>

  <!--   STEP: generating user/project/mentor/support mapping information (every 15 steps)   -->
  <step active="0" id="webservice" exec_after="initcoldir" type="execute">
  <cmd  exec="mkdir -p $permdir/wservice" />
  <cmd  exec="$perl $instdir/utils/exec_every_n_step_or_empty.pl $permdir/stepcount_webservice.dat 
                                                                  15
                                                                  $instdir/utils/empty_LML.xml 
                                                                  $permdir/wservice/accountmap.xml
                                                                  /usr/bin/perl $instdir/rms/JSCinternal/get_webservice_accounts.pl 
                                                                                        -system systemname 
                                                                                        --support $permdir/wservice/support_input.dat 
                                                                                        -lml $permdir/wservice/accountmap.xml
                                                                                        "/>
    <cmd  exec="cp -p $permdir/wservice/accountmap.xml $tmpcoldir"/>
  </step>


  <!--   STEP: synchronize long running queries   -->
  <step active="1" id="rawdataready" exec_after="cpdataremote,da_io_gpfs,da_promet,da_icmap,da_errmsg,da_checkmk,webservice" type="execute">
    <cmd exec="echo 'raw data ready'"/>
  </step>


  <!--   STEP: copying timing information of collect action (this one)   -->
  <step active="1" id="da_step_timings_collect" exec_after="rawdataready" type="execute">
    <cmd  exec="$perl $instdir/utils/cp_if_newer_or_empty.pl  
                                                $tmpdir/step_timing_collect_new.xml   
                                                $tmpdir/step_timing_collect_LML.xml   
                                                $tmpdir/step_timing_collect_LML_done.xml   
                                                $instdir/utils/empty_LML.xml"/>
    <cmd  exec="cp -p $tmpdir/step_timing_collect_new.xml $tmpdir/step_timing_collect_LML_done.xml | true"/>
    <cmd  exec="cp -p $tmpdir/step_timing_collect_LML.xml $tmpcoldir | true"/>
  </step>

  <!--   STEP: copying timing information of dbupdate action   -->
  <step active="1" id="da_step_timings_dbupdate" exec_after="rawdataready" type="execute">
    <cmd  exec="$perl $instdir/utils/cp_if_newer_or_empty.pl  
                                                $tmpdir/step_timing_dbupdate_new.xml   
                                                $tmpdir/step_timing_dbupdate_LML.xml   
                                                $tmpdir/step_timing_dbupdate_LML_done.xml   
                                                $instdir/utils/empty_LML.xml"/>
    <cmd  exec="cp -p $tmpdir/step_timing_dbupdate_new.xml $tmpdir/step_timing_dbupdate_LML_done.xml | true"/>
    <cmd  exec='[ -e "$tmpcoldir/step_timing_dbupdate_LML.xml" ] && cp -p "$tmpdir/step_timing_dbupdate_LML.xml" "$tmpcoldir/step_timing_dbupdate_LML_$(date +%s%N).xml" || cp -p "$tmpdir/step_timing_dbupdate_LML.xml" "$tmpcoldir"'/>
  </step>

  <!--   STEP: copying timing information of lmlarch action   -->
  <step active="1" id="da_step_timings_lmlarch" exec_after="rawdataready" type="execute">
    <cmd  exec="$perl $instdir/utils/cp_if_newer_or_empty.pl  
                                                $tmpdir/step_timing_lmlarch_new.xml   
                                                $tmpdir/step_timing_lmlarch_LML.xml   
                                                $tmpdir/step_timing_lmlarch_LML_done.xml   
                                                $instdir/utils/empty_LML.xml"/>
    <cmd  exec="cp -p $tmpdir/step_timing_lmlarch_new.xml $tmpdir/step_timing_lmlarch_LML_done.xml | true"/>
    <cmd  exec="cp -p $tmpdir/step_timing_lmlarch_LML.xml $tmpcoldir | true"/>
  </step>

  <!--   STEP: copying timing information of jobreport action   -->
  <step active="1" id="da_step_timings_jobreport" exec_after="rawdataready" type="execute">
    <cmd  exec="$perl $instdir/utils/cp_if_newer_or_empty.pl  
                                                $tmpdir/step_timing_jobreport_new.xml   
                                                $tmpdir/step_timing_jobreport_LML.xml   
                                                $tmpdir/step_timing_jobreport_LML_done.xml   
                                                $instdir/utils/empty_LML.xml"/>
    <cmd  exec="cp -p $tmpdir/step_timing_jobreport_new.xml $tmpdir/step_timing_jobreport_LML_done.xml | true"/>
    <cmd  exec="cp -p $tmpdir/step_timing_jobreport_LML.xml $tmpcoldir | true"/>
  </step>

  <!--   STEP: copying timing information of jufo action   -->
  <step active="0" id="da_step_timings_jufo" exec_after="rawdataready" type="execute">
    <cmd  exec="$perl $instdir/utils/cp_if_newer_or_empty.pl  
                                                $tmpdir/step_timing_jufo_new.xml   
                                                $tmpdir/step_timing_jufo_LML.xml   
                                                $tmpdir/step_timing_jufo_LML_done.xml   
                                                $instdir/utils/empty_LML.xml"/>
    <cmd  exec="cp -p $tmpdir/step_timing_jufo_new.xml $tmpdir/step_timing_jufo_LML_done.xml | true"/>
    <cmd  exec="cp -p $tmpdir/step_timing_jufo_LML.xml $tmpcoldir | true"/>
  </step>

  <!--   STEP: copying timing information of lmlstat action   -->
  <step active="1" id="da_step_timings_lmlstat" exec_after="rawdataready" type="execute">
    <cmd  exec="$perl $instdir/utils/cp_if_newer_or_empty.pl  
                                                $tmpdir/step_timing_lmlstat_new.xml   
                                                $tmpdir/step_timing_lmlstat_LML.xml   
                                                $tmpdir/step_timing_lmlstat_LML_done.xml   
                                                $instdir/utils/empty_LML.xml"/>
    <cmd  exec="cp -p $tmpdir/step_timing_lmlstat_new.xml $tmpdir/step_timing_lmlstat_LML_done.xml | true"/>
    <cmd  exec="cp -p $tmpdir/step_timing_lmlstat_LML.xml $tmpcoldir | true"/>
  </step>


  <!-- STEPS: Copying internal statistics files -->
  <step active="1" id="da_stat" exec_after="rawdataready" type="execute">
    <cmd  exec="$perl $instdir/utils/cp_if_newer_or_empty.pl  
                                                $tmpdir/LMLDBupdate_stat_LML_new.xml   
                                                $tmpdir/LMLDBupdate_stat_LML.xml   
                                                $tmpdir/LMLDBupdate_stat_LML_done.xml   
                                                $instdir/utils/empty_LML.xml"/>
    <cmd  exec="cp -p $tmpdir/LMLDBupdate_stat_LML_new.xml  $tmpdir/LMLDBupdate_stat_LML_done.xml | true"/>
    <cmd  exec="cp -p $tmpdir/LMLDBupdate_stat_LML.xml $tmpcoldir | true"/>
  </step>
  <step active="1" id="da_jr_stat" exec_after="rawdataready" type="execute">
    <cmd  exec="$perl $instdir/utils/cp_if_newer_or_empty.pl  
                                                $tmpdir/LL_jobreport_stat_LML_new.xml   
                                                $tmpdir/LL_jobreport_stat_LML.xml   
                                                $tmpdir/LL_jobreport_stat_LML_done.xml   
                                                $instdir/utils/empty_LML.xml"/>
    <cmd  exec="cp -p $tmpdir/LL_jobreport_stat_LML_new.xml $tmpdir/LL_jobreport_stat_LML_done.xml | true"/>
    <cmd  exec="cp -p $tmpdir/LL_jobreport_stat_LML.xml $tmpcoldir | true"/>
  </step>
  <step active="1" id="da_tr_stat" exec_after="rawdataready" type="execute">
    <cmd  exec="$perl $instdir/utils/cp_if_newer_or_empty.pl  
                                                $tmpdir/transferreports_stat_LML_new.xml   
                                                $tmpdir/transferreports_stat_LML.xml   
                                                $tmpdir/transferreports_stat_LML_done.xml   
                                                $instdir/utils/empty_LML.xml"/>
    <cmd  exec="cp -p $tmpdir/transferreports_stat_LML_new.xml $tmpdir/transferreports_stat_LML_done.xml | true"/>
    <cmd  exec="cp -p $tmpdir/transferreports_stat_LML.xml $tmpcoldir | true"/>
  </step>

  <step active="1" id="da_LMLdbstat" exec_after="rawdataready" type="execute">
    <cmd  exec="$perl $instdir/utils/cp_if_newer_or_empty.pl  
                                                $tmpdir/LMLDBstat_new.xml
                                                $tmpdir/LMLDBstat.xml   
                                                $tmpdir/LMLDBstat_done.xml   
                                                $instdir/utils/empty_LML.xml"/>
    <cmd  exec="cp -p $tmpdir/LMLDBstat_new.xml $tmpdir/LMLDBstat_done.xml | true"/>
    <cmd  exec="cp -p $tmpdir/LMLDBstat.xml $tmpcoldir | true"/>
  </step>


  <!--   STEP: collection step to signal that all the data-gathering steps are completed   -->
  <step active="1" id="timingsready" exec_after="da_step_timings_collect,da_step_timings_dbupdate,da_step_timings_lmlarch,da_step_timings_jobreport,da_step_timings_jufo,da_step_timings_lmlstat,da_stat,da_jr_stat,da_tr_stat,da_LMLdbstat" type="execute">
    <cmd exec="echo 'raw data ready'"/>
  </step>

  <!-- --------------------------------------- -->
  <!--   prepare LML files for archiving       -->
  <!-- --------------------------------------- -->
  <step active="1" id="LMLprepare_arch" exec_after="timingsready" type="execute">
    <cmd exec="mkdir -p $tmplmlarchdir && cp -p $tmpcoldir/* $tmplmlarchdir"/>
    <cmd exec="cp $stepcountersave $tmpcntdir/stepcounter_lmlarch.dat | true" />
    <cmd exec="touch $permdir/lmlarch_start.ready"/> <!-- signal to start archiving LML files (another workflow) -->
    <cmd exec="cp $stepcountersave $tmpcntdir/stepcounter_dbupdate.dat | true" />
    <cmd exec="touch $permdir/collect.ready"/> <!-- signal to start update DB workflow -->
    <cmd exec="mkdir -p $sharedcollectdir && cp -p $tmpcoldir/* $sharedcollectdir"/>
    <cmd exec="touch $shareddir/datafiles.xml_buffer.ready"/> <!-- signal to start collect on other server, if needed -->
    <cmd exec="$instdir/utils/da_lock.pl --verbose --debug --lockfile=$lockfile release" />
  </step>

</LML_da_workflow>
