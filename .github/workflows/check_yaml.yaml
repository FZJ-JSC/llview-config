name: check_yaml

on:
  push:
  pull_request:

jobs:
  check_yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install yamllint
        run: pip install yamllint
      - name: Strip include directives
        run: find . -path ./.git -prune -o \( -name "*.yaml" -o -name "*.yml" \) -type f -not -path "./.github/*" -exec sed -i -e '/%include /d' -e '/%includedir /d' {} \;
      - name: Run yamllint
        run: yamllint -c .yamllint.yml --no-warnings .
