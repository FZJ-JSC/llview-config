              headerTooltip: "Number of used cores (>25%) in jobs using this pattern",
              cellDataType: "number",
              width: 120,
            },
            { 
              field: "gpu",
              headerName: "GPU Node",
              headerTooltip: "Flag for GPU nodes (1) or not (0)",
              cellDataType: "number",
              width: 120,
            },
            { 
              field: "nodeh",
              headerName: "Node Hours",
              headerTooltip: "Total amount of node-hours spent by jobs using this pattern (in the last 3 days)",
              cellDataType: "number",
              valueFormatter: "(params) => round_number_or_null(params)",
              width: 120,
              sort: 'desc',
            },
            { 
              field: "njobs",
              headerName: "#Jobs",
              headerTooltip: "Number of jobs using this pattern (in the last 3 days)",
              cellDataType: "number",
              width: 120,
            },
            { 
              field: "min_ts",
              headerName: "MaxAge",
              headerTooltip: "Hours since first job with this pattern (in the last 3 days)",
              cellDataType: "number",
              valueFormatter: "(params) => round_number_or_null(params)",
              width: 120,
            },
            { 
              field: "max_ts",
              headerName: "MinAge",
              headerTooltip: "Hours since last job with this pattern",
              cellDataType: "number",
              valueFormatter: "(params) => round_number_or_null(params)",
              width: 120,
            },
          ]
        }
      - { 
          field: "jobids",
          headerName: "JobID List",
          headerTooltip: "Jobs using this pattern (in the last 3 days)",
          cellDataType: "text",
          cellClass: "text-left",
          cellRenderer: "(params) => gen_jobid_list_link(params)",
          wrapText: true,
          autoHeight: true,
          flex: 2,
          minWidth: 200,
        }

- dataset:
    name: template_joblist_source_stat
    set:           template
    filepath:      '$outputdir/LLtemplates/joblist_source_stat.handlebars'
    stat_database: jobreport_json_stat
    stat_table:    datasetstat_templates
    format:        'template'
    columns:
      - { name: s_start,      group: "jobliststat", sort: "N", title: "S_start",        data_format: "round_number_or_null_int", desc: "Source job (scontrol) available"      }
      - { name: s_ts,         group: "jobliststat", sort: "N", title: "S_ts",           data_format: "round_number_or_null_int", desc: "Source ts (last update) available" }
      - { name: s_defer,      group: "jobliststat", sort: "N", title: "S_defer",        data_format: "round_number_or_null_int", desc: "Source defer (15min intervall) available"}
      - { name: s_step,       group: "jobliststat", sort: "N", title: "S_step",         data_format: "round_number_or_null_int", desc: "Source step (sacct) available" }
      - { name: s_err,        group: "jobliststat", sort: "N", title: "S_err",          data_format: "round_number_or_null_int", desc: "Source error counter available" }
      - { name: s_ld,         group: "jobliststat", sort: "N", title: "S_ld",           data_format: "round_number_or_null_int", desc: "Source loadmem available" }
      - { name: s_rc,         group: "jobliststat", sort: "N", title: "S_rc",           data_format: "round_number_or_null_int", desc: "Source rc (sacct)"}
      - { name: s_co,         group: "jobliststat", sort: "N", title: "S_co",           data_format: "round_number_or_null_int", desc: "Source cores available" }
      - { name: s_fa,         group: "jobliststat", sort: "N", title: "S_fa",           data_format: "round_number_or_null_int", desc: "Source fabric available" }
      - { name: s_ic,         group: "jobliststat", sort: "N", title: "S_ic",           data_format: "round_number_or_null_int", desc: "Source ICmap available" }
      - { name: s_fs,         group: "jobliststat", sort: "N", title: "S_fs",           data_format: "round_number_or_null_int", desc: "Source file system available" }
      - { name: s_gpu,        group: "jobliststat", sort: "N", title: "S_gpu",          data_format: "round_number_or_null_int", desc: "Source GPU available"}
      - { name: num_jobs,     group: "jobliststat", sort: "N", title: "#jobs",          data_format: "round_number_or_null_int", desc: "number of jobs" }
      - { name: min_ts_start, group: "jobliststat", sort: "D", title: "min_ts_start",   desc: "min job start time stamp" }
      - { name: min_ts,       group: "jobliststat", sort: "D", title: "min_ts",         desc: "min update timestamp" }
      - { name: max_ts_start, group: "jobliststat", sort: "D", title: "max_ts_start",   desc: "max job start time stamp" }
      - { name: max_ts,       group: "jobliststat", sort: "D", title: "max_ts",         desc: "max update timestamp" }
      - { name: min_jobid,    group: "jobliststat", sort: "S", title: "min_jobid",      desc: "min jobid"}
      - { name: max_jobid,    group: "jobliststat", sort: "S", title: "max_jobidN",     desc: "max jobid"}
      - { name: avg_jwallm,   group: "jobliststat", sort: "N", title: "avg_wall(min)",  data_format: "round_number_or_null", desc: "avg wall time of job" }
      - { name: max_jwallm,   group: "jobliststat", sort: "N", title: "max_wall(min)",  data_format: "round_number_or_null", desc: "max wall time of job" }
      

