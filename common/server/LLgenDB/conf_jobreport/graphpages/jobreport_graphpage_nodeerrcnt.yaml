############
# Graph Page
############
- graphpage:
    name:          "nodeerrcnt"
    filepath:      "$outputdir/ll/graphpage_nodeerrcnt.json"
    stat_database: jobreport_json_stat
    stat_table:    datasetstat_graphpages
    columns: 1
    graphs: 
       - name: "Node_error_counts"
         xcol: "nodeid"
         height: "550px"
         layout:
           #%include "jobreport_graphpage_layout_range.yaml"
           xaxis:
            type: 'category'
            autorange: true
           yaxis: 
               title: "#errors"
           legend:
               x: "0.0"
               xref: "x domain"
               xanchor: "left"
               y: "1"
               yanchor: "top"
           title:
               text: "<b>Number of errors per node<b>"
               font: 
                  family: 'Arial'
                  size: 16
               xref: "x domain"
               x:    "0.5"
               xanchor: "center"
         traces:
           - name:   "Uncategorized (msgcls 0)"
             ycol: "c0_cnt"
             yaxis:  "y"
            #  mode:   "lines+markers"
            #  marker:
            #      size: 3
             color:  "#00B000"
             stackgroup: "errcnts"
             datapath: "data/_sysstat/nodeerr_cnt_by_msgcls.csv"
           - name:   "Segfaults (msgcls 1)"
             ycol: "c1_cnt"
             yaxis:  "y"
             type:   "line"
             color:  "#00B0B0"
             stackgroup: "errcnts"
             datapath: "data/_sysstat/nodeerr_cnt_by_msgcls.csv"
           - name:   "Out of Memory (msgcls 2)"
             ycol: "c2_cnt"
             yaxis:  "y"
             type:   "line"
             color:  "#B0B000"
             stackgroup: "errcnts"
             datapath: "data/_sysstat/nodeerr_cnt_by_msgcls.csv"
           - name:   "Node down (msgcls 3)"
             ycol: "c3_cnt"
             yaxis:  "y"
             type:   "line"
             color:  "#0000B0"
             stackgroup: "errcnts"
             datapath: "data/_sysstat/nodeerr_cnt_by_msgcls.csv"
