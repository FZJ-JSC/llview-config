# ----------------------------------------------------
# Per-Node Process Details JSON (1 file per node)
# ----------------------------------------------------
- dataset:
    name:            login_process_overview_json
    set:             json_loginnodes
    FORALL:          'N:VAR_loginnodes'
    filepath:        '$outputdir/support/login_process_$N.json.gz'
    column_filemap:  'N:nodeid'
    data_database:   loginnodes
    data_table:      login_process_overview
    table_cache:     login_process_cache
    table_cache_par_level: 1
    stat_table:      datasetstat_login_process
    stat_database:   jobreport_json_stat
    format:          'json'
    columns:         'systemname, nodeid, owner, pid, name, cmd, cpu_pct, elapsed, cpu_time_secs, cpu_score, threads, d_state_threads, d_state_score, mem_rss_mb, mem_score, gpu_mem_used_mb'
    # Sort by the heaviest CPU processes first
    order:           "cpu_pct DESC"

# ----------------------------------------------------
# ALL Processes Details JSON (No FORALL)
# ----------------------------------------------------
- dataset:
    name:            login_process_all_json
    set:             json_loginnodes
    filepath:        '$outputdir/_queued/login_process_all.json.gz'
    data_database:   loginnodes
    data_table:      login_process_overview
    stat_table:      datasetstat_login_process
    stat_database:   jobreport_json_stat
    format:          'json'
    # No sql_where filtering, meaning it grabs everything!
    columns:         'systemname, nodeid, owner, pid, name, cmd, cpu_pct, elapsed, cpu_time_secs, cpu_score, threads, d_state_threads, d_state_score, mem_rss_mb, mem_score, gpu_mem_used_mb'
    order:           "cpu_pct DESC"
