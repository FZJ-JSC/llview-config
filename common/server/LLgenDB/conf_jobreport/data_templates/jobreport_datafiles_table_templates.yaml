- dataset:
    name: template_login_node_overview
    set: template
    filepath: '$outputdir/LLtemplates/login_node_overview.handlebars'
    stat_database: jobreport_json_stat
    stat_table:    datasetstat_templates
    format: 'datatable'
    ag-grid-theme: 'balham'
    columns:
      - {
          field: "nodeid",
          headerName: "Login Node",
          headerTooltip: "Identifier of the login node",
          cellDataType: "text",
          cellRenderer: "(params) => gen_tab_link(params,'loginnodes.login_')",
          pinned: "left",
          minWidth: 120,
        }
      - {
          field: "address",
          headerName: "Address",
          headerTooltip: "Network address of the login node",
          cellDataType: "text",
          minWidth: 180,
        }
      - {
            headerName: "Users",
            groupId: "Users",
            children: [
              {
                field: "logged_in_users",
                headerName: "Logged In",
                headerTooltip: "Total number of users with an active session on this node",
                cellDataType: "number",
                minWidth: 100,
              },
              {
                field: "users_with_procs",
                headerName: "With Procs",
                headerTooltip: "Number of users running at least one process",
                cellDataType: "number",
                minWidth: 110,
              },
            ]
          }
      - {
          headerName: "CPU",
          groupId: "CPU",
          children: [
            {
              field: "load_1m",
              headerName: "Load",
              headerTooltip: "CPU load average over the last 1 minute.",
              cellDataType: "number",
              cellStyle: "(params) => cell_background_color(params,'load_score')",
              minWidth: 100,
            },
            {
              field: "running_procs",
              headerName: "Running Processes",
              headerTooltip: "Number of processes actively running on CPU cores (State 'R')",
              cellDataType: "number",
              minWidth: 120,
            },
            {
              field: "total_cores",
              columnGroupShow: "open",
              headerName: "Cores",
              headerTooltip: "Total number of physical CPU cores available on the node",
              cellDataType: "number",
              minWidth: 80,
            },
          ]
        }
      - {
          headerName: "Process Warnings",
          groupId: "Warnings",
          children: [
            {
              field: "max_proc_cpu_pct",
              headerName: "Max CPU %",
              headerTooltip: "Highest CPU % of a single process. Red indicates >1500% CPU for over 1 hour.",
              cellDataType: "number",
              cellStyle: "(params) => cell_background_color(params,'worst_cpu_score')",
              minWidth: 120,
            },
            {
              field: "max_proc_d_state",
              headerName: "Max D-State Threads",
              headerTooltip: "Highest number of D-State threads in a single process. Warning >10, Critical >100.",
              cellDataType: "number",
              cellStyle: "(params) => cell_background_color(params,'d_state_score')",
              minWidth: 160,
            },
          ]
        }
      - {
          headerName: "GPU",
          groupId: "GPU",
          children: [
            {
              field: "gpu_util_pct",
              headerName: "Utilization (%)",
              headerTooltip: "GPU processing utilization percentage",
              cellDataType: "number",
              minWidth: 110,
            },
            {
              field: "gpu_mem_used_mb",
              headerName: "Mem Used (MB)",
              headerTooltip: "GPU memory currently in use",
              cellDataType: "number",
              minWidth: 120,
            },
          ]
        }
      - {
          headerName: "Memory",
          groupId: "Mem",
          children: [
            {
              field: "mem_used_mb",
              headerName: "Used (MB)",
              headerTooltip: "Total physical memory used in MB",
              cellDataType: "number",
              minWidth: 110,
            },
            {
              field: "mem_total_mb",
              columnGroupShow: "open",
              headerName: "Total (MB)",
              headerTooltip: "Total physical memory installed on the node in MB",
              cellDataType: "number",
              minWidth: 110,
            },
            {
              field: "mem_used_pct",
              headerName: "Used (%)",
              headerTooltip: "Percentage of physical memory currently in use. Warns >50%, Critical >70%.",
              cellDataType: "number",
              valueFormatter: "(params) => round_number(params,2)",
              cellStyle: "(params) => cell_background_color(params,'mem_score')",
              minWidth: 90,
            },
          ]
        }
      - {
          headerName: "Temporary Storage",
          groupId: "Tmp",
          children: [
            # 1. /tmp Used % (Visible by default)
            {
              field: "tmp_used_pct",
              headerName: "/tmp (%)",
              headerTooltip: "Percentage of /tmp disk storage currently in use",
              cellDataType: "number",
              valueFormatter: "(params) => round_number(params,2)",
              cellStyle: "(params) => cell_background_color(params,'tmp_score')",
              minWidth: 90,
            },
            # 3. /tmp Details (Hidden until group is expanded)
            {
              field: "tmp_used_mb",
              columnGroupShow: "open",
              headerName: "/tmp Used (MB)",
              headerTooltip: "Space used in /tmp in MB",
              cellDataType: "number",
              minWidth: 110,
            },
            {
              field: "tmp_total_mb",
              columnGroupShow: "open",
              headerName: "/tmp Total (MB)",
              headerTooltip: "Total space available in /tmp in MB",
              cellDataType: "number",
              minWidth: 110,
            },
            {
              field: "top_tmp_users",
              columnGroupShow: "open",
              headerName: "/tmp Top Users",
              headerTooltip: "Top 3 users utilizing /tmp storage on this node",
              cellDataType: "text",
              minWidth: 180,
              wrapText: true,
              autoHeight: true,
            },
            # 2. /dev/shm Used % (Visible by default)
            {
              field: "dev_shm_used_pct",
              headerName: "/dev/shm (%)",
              headerTooltip: "Percentage of /dev/shm shared memory (RAM) currently in use",
              cellDataType: "number",
              valueFormatter: "(params) => round_number(params,2)",
              cellStyle: "(params) => cell_background_color(params,'dev_shm_score')",
              minWidth: 100,
            },
            # 4. /dev/shm Details (Hidden until group is expanded)
            {
              field: "dev_shm_used_mb",
              columnGroupShow: "open",
              headerName: "/dev/shm Used (MB)",
              headerTooltip: "Space used in /dev/shm shared memory in MB",
              cellDataType: "number",
              minWidth: 120,
            },
            {
              field: "dev_shm_total_mb",
              columnGroupShow: "open",
              headerName: "/dev/shm Total (MB)",
              headerTooltip: "Total space available in /dev/shm in MB",
              cellDataType: "number",
              minWidth: 120,
            },
            {
              field: "top_shm_users",
              columnGroupShow: "open",
              headerName: "/dev/shm Top Users",
              headerTooltip: "Top 3 users utilizing /dev/shm shared memory on this node",
              cellDataType: "text",
              minWidth: 180,
              wrapText: true,
              autoHeight: true,
            },
          ]
        }


- dataset:
    name: template_login_process_overview
    set: template
    filepath: '$outputdir/LLtemplates/login_process_overview.handlebars'
    stat_database: jobreport_json_stat
    stat_table:    datasetstat_templates
    format: 'datatable'
    ag-grid-theme: 'balham'
    columns:
      - {
          field: "pid",
          headerName: "PID",
          headerTooltip: "Process ID",
          cellDataType: "number",
          pinned: "left",
          minWidth: 90,
        }
      - {
          headerName: "Host",
          groupId: "Host",
          children: [
            {
              field: "systemname",
              headerName: "System",
              headerTooltip: "Cluster/System name",
              cellDataType: "text",
              minWidth: 100,
            },
            {
              field: "nodeid",
              headerName: "Node",
              headerTooltip: "Login Node name",
              cellDataType: "text",
              minWidth: 120,
            },
          ]
        }
      - {
          headerName: "Process Info",
          groupId: "Info",
          children: [
            {
              field: "name",
              headerName: "Name",
              headerTooltip: "Process name",
              cellDataType: "text",
              minWidth: 120,
            },
            {
              field: "owner",
              headerName: "User",
              headerTooltip: "Username owning the process",
              cellDataType: "text",
              minWidth: 100,
            },
          ]
        }
      - {
          field: "cmd",
          headerName: "Command",
          headerTooltip: "Full command line execution string",
          cellDataType: "text",
          wrapText: true,
          autoHeight: true,
          minWidth: 200,
          flex: 1,
        }
      - {
          headerName: "CPU Usage",
          groupId: "CPU",
          children: [
            {
              field: "cpu_pct",
              headerName: "CPU %",
              headerTooltip: "CPU utilization percentage (Warns >1500% over 1h)",
              cellDataType: "number",
              cellStyle: "(params) => cell_background_color(params,'cpu_score')",
              minWidth: 100,
              sort: 'desc',
            },
            {
              field: "elapsed",
              headerName: "Elapsed",
              headerTooltip: "Wall clock time since the process started",
              cellDataType: "timeInterval",
              filter: "TimeIntervalParentFilter",
              floatingFilterComponent: "TimeIntervalFloatingFilterComponent",
              cellStyle: "(params) => cell_background_color(params,'cpu_score')",
              minWidth: 120,
            },
            {
              field: "cpu_time_secs",
              headerName: "CPU Time",
              headerTooltip: "Total accumulated CPU time",
              cellDataType: "timeInterval",
              filter: "TimeIntervalParentFilter",
              floatingFilterComponent: "TimeIntervalFloatingFilterComponent",
              minWidth: 120,
            },
            { field: "cpu_score", hide: true }
          ]
        }
      - {
          headerName: "Threads",
          groupId: "Threads",
          children: [
            {
              field: "threads",
              headerName: "Total",
              headerTooltip: "Number of threads spawned by this process",
              cellDataType: "number",
              minWidth: 90,
            },
            {
              field: "d_state_threads",
              headerName: "D-State",
              headerTooltip: "Threads stuck in Uninterruptible Sleep. Warns >10.",
              cellDataType: "number",
              cellStyle: "(params) => cell_background_color(params,'d_state_score')",
              minWidth: 100,
            },
          ]
        }
      - {
            headerName: "Memory",
            groupId: "Mem",
            children: [
              {
                field: "mem_rss_mb",
                headerName: "RAM (MB)",
                headerTooltip: "Resident Set Size (physical memory) used. Critical >20% of node memory.",
                cellDataType: "number",
                cellStyle: "(params) => cell_background_color(params,'mem_score')",
                minWidth: 110,
              },
              {
                field: "gpu_mem_used_mb",
                headerName: "GPU Mem (MB)",
                headerTooltip: "GPU memory consumed",
                cellDataType: "number",
                minWidth: 120,
              },
            ]
          }

%include "jobreport_datafiles_table_templates_memoryheatmap.yaml"