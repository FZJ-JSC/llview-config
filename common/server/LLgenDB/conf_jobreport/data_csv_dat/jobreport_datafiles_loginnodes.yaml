# ----------------------------------------------------
# Global Overview JSON (1 file)
# ----------------------------------------------------
- dataset:
    name:            login_node_overview_json
    set:             json_loginnodes
    filepath:        '$outputdir/support/login_node_overview.json.gz'
    data_database:   loginnodes
    data_table:      login_node_overview
    stat_table:      datasetstat_login_overview
    stat_database:   jobreport_json_stat
    format:          'json'
    columns:         'systemname, nodeid, address, logged_in_users, users_with_procs, load_1m, load_score, running_procs, total_cores, max_proc_cpu_pct, worst_cpu_score, max_proc_d_state, d_state_score, gpu_util_pct, gpu_mem_used_mb, gpu_mem_total_mb, mem_total_mb, mem_used_mb, mem_used_pct, mem_score, tmp_total_mb, tmp_used_mb, tmp_used_pct, tmp_score, top_tmp_users, dev_shm_total_mb, dev_shm_used_mb, dev_shm_used_pct, dev_shm_score, top_shm_users'
    order:           "nodeid ASC"

