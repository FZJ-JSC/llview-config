############
# Graph Page
############
- graphpage:
    name:          "nodeerrcntheatmap"
    filepath:      "$outputdir/ll/graphpage_nodeerrcnt_heatmap.json"
    stat_database: jobreport_json_stat
    stat_table:    datasetstat_graphpages
    columns: 1
    graphs: 
       - name: "Node_error_counts_heatmap"
         #height: "350px"
         height: "600px"
         fillNA: 0
         xcol: "date"
         traces:
           - name: "Error counts"
             xcol: "date"
             ycol: "nodeid"
             yaxis:  "y"
             zcol: "cnt"
             type:   "heatmap"
             colorscale: "Reds"
             colorbar:
                title: "Error count"
                thicknessmode: "pixels"
                thickness: 15
                len: 0.7
             datapath: "data/_sysstat/nodeerr_cnt_by_day.csv"
         layout:
           #%include "jobreport_graphpage_layout_range.yaml"
           legend:
               x: "0.0"
               xref: "x domain"
               xanchor: "left"
               y: "1"
               yanchor: "top"
           title:
               text: "<b>Heatmap of errors per node</b>"
               font: 
                  family: 'Arial'
                  size: 16
               xref: "x domain"
               x:    "0.5"
               xanchor: "center"
