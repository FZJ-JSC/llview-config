############
# Graph Page
############
- graphpage:
    name:          "syspower"
    filepath:      "$outputdir/ll/graphpage_syspower.json"
    stat_database: jobreport_json_stat
    stat_table:    datasetstat_graphpages
    columns: 1
    graphs: 
       - name: "system_rack_power"
         xcol: "date"
         height: "500px"
         layout:
           %include "jobreport_graphpage_layout_range.yaml"
           yaxis: 
               title: 
                  text: "Power Usage all Racks (MW)"
           legend:
               x: "0.0"
               xref: "x domain"
               xanchor: "left"
               y: "1"
               yanchor: "top"
           title:
               text: "<b>Total Power consumption (MW)</b> (all racks, based on per-minute probes)"
               font: 
                  family: 'Arial'
                  size: 16
               xref: "x domain"
               x:    "0.5"
               xanchor: "center"
         traces:
           - name:   "Power/All Racks"
             ycol: "power"
             yaxis:  "y"
             type:   "line"
             stackgroup: "power"
             color:  "#0003F0"
             datapath: "data/_sysstat/sysrackpwr_allracks.csv"

       - name: "system_rack_power_minmax"
         xcol: "date"
         height: "400px"
         layout:
           %include "jobreport_graphpage_layout_range.yaml"
           yaxis: 
               title: 
                  text: "Power Usage per Rack (kW)"
           legend:
               x: "0.0"
               xref: "x domain"
               xanchor: "left"
               y: "1"
               yanchor: "top"
           title:
               text: "<b>Power consumption per Rack (MW)</b> (min/avg/max, based on per-minute probes)"
               font: 
                  family: 'Arial'
                  size: 16
               xref: "x domain"
               x:    "0.5"
               xanchor: "center"
         traces:
           - name:   "Power/Rack"
             ycol: "power"
             yaxis:  "y"
             type:   "scatter"
             color:  "#00D040"
             datapath: "data/_sysstat/sysrackpwr_allracks_minmax.csv"
           
