############
# Graph Page
############
- graphpage:
    name:          "queuestatistics"
    filepath:      "$outputdir/ll/graphpage_queuestatistics.json"
    stat_database: jobreport_json_stat
    stat_table:    datasetstat_graphpages
    columns: 1
    graphs: 
       - name: "Queue_stat_numjobs"
         xcol: "date"
         height: "450px"
         layout:
           %include "jobreport_graphpage_layout_range.yaml"
           annotations: 
             -   xref: "paper"
                 yref: "paper"
                 x: 1.0
                 xanchor: "right"
                 align: "right"
                 y: 1.0
                 yanchor: "bottom"
                 text: "Current number of jobs: #last_sum#, Maximum: #max#"
                 showarrow: false
           yaxis: 
               title: 
                  text: "#jobs"
           legend:
               x: "0.0"
               xref: "x domain"
               xanchor: "left"
               y: "1"
               yanchor: "top"
           title:
               text: "<b>Number of Eligible Waiting Jobs<b>"
               font: 
                  family: 'Arial'
                  size: 16
               xref: "x domain"
               x:    "0.5"
               xanchor: "center"
         traces:
           %include "jobreport_graphpage_sysoverview_queue_jobs_requ.yaml"  
       - name: "Queue_stat_sum_nodes"
         xcol: "date"
         height: "450px"
         layout:
           %include "jobreport_graphpage_layout_range.yaml"
           annotations: 
             -   xref: "paper"
                 yref: "paper"
                 x: 1.0
                 xanchor: "right"
                 align: "right"
                 y: 1.0
                 yanchor: "bottom"
                 text: "Current number of nodes: #last_sum#, Maximum: #max#"
                 showarrow: false
           yaxis: 
               title: 
                  text: "#nodes"
           legend:
               x: "0.0"
               xref: "x domain"
               xanchor: "left"
               y: "1"
               yanchor: "top"
           title:
               text: "<b>Number of Nodes Requested by Eligible Waiting Jobs<b>"
               font: 
                  family: 'Arial'
                  size: 16
               xref: "x domain"
               x:    "0.5"
               xanchor: "center"
         traces:
           %include "jobreport_graphpage_sysoverview_queue_nodes_requ.yaml"  
