############
# Graph Page
############
- graphpage:
    name:          "sysenergy"
    filepath:      "$outputdir/ll/graphpage_sysenergy.json"
    stat_database: jobreport_json_stat
    stat_table:    datasetstat_graphpages
    columns: 1
    graphs: 
       - name: "system_rack_energy_hour"
         xcol: "date"
         height: "500px"
         layout:
           %include "jobreport_graphpage_layout_range.yaml"
           yaxis: 
               title: 
                  text: "Energy Usage all Racks (MWh per hour)"
           legend:
               x: "0.0"
               xref: "x domain"
               xanchor: "left"
               y: "1"
               yanchor: "top"
           title:
               text: "<b>Total Energy consumption (MWh / hour)</b> (all racks, based on per-minute probes)"
               font: 
                  family: 'Arial'
                  size: 16
               xref: "x domain"
               x:    "0.5"
               xanchor: "center"
         traces:
           - name:   "Energy_all_racks"
             ycol: "energy_sum"
             yaxis:  "y"
             type:   "line"
             stackgroup: "energy"
             color:  "#0003F0"
             datapath: "data/_sysstat/sysrackeng_allracks_hour.csv"
             
       - name: "system_rack_energy_day"
         xcol: "date"
         height: "300px"
         layout:
           %include "jobreport_graphpage_layout_range.yaml"
           yaxis: 
               title: 
                  text: "Energy Usage all Racks (MWh per day)"
           legend:
               x: "0.0"
               xref: "x domain"
               xanchor: "left"
               y: "1"
               yanchor: "top"
           title:
               text: "<b>Total Energy consumption (MWh / day)</b> (all racks, based on per-minute probes)"
               font: 
                  family: 'Arial'
                  size: 16
               xref: "x domain"
               x:    "0.5"
               xanchor: "center"
         traces:
           - name:   "Energy_all_racks"
             ycol: "energy_sum"
             yaxis:  "y"
             type:   "line"
             stackgroup: "energy"
             color:  "#0023F0"
             datapath: "data/_sysstat/sysrackeng_allracks_day.csv"

       - name: "system_rack_energy_month"
         xcol: "date"
         height: "300px"
         layout:
           %include "jobreport_graphpage_layout_range.yaml"
           yaxis: 
               title: 
                  text: "Energy Usage all Racks (MWh per month)"
           legend:
               x: "0.0"
               xref: "x domain"
               xanchor: "left"
               y: "1"
               yanchor: "top"
           title:
               text: "<b>Total Energy consumption (MWh / month)</b> (all racks, based on per-minute probes)"
               font: 
                  family: 'Arial'
                  size: 16
               xref: "x domain"
               x:    "0.5"
               xanchor: "center"
         traces:
           - name:   "Energy_all_racks"
             ycol: "energy_sum"
             yaxis:  "y"
             type:   "line"
             stackgroup: "energy"
             color:  "#0053F0"
             datapath: "data/_sysstat/sysrackeng_allracks_month.csv"
           
