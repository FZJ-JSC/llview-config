# JUPITER GH200:
# HOST memory: 4*120GB = 480 GB
# GPU  memory: 4*96GB  = 384 GB
# --> 864 GB per node

- chart:
   name:     'system_memory'
   x-axes:
      type: 'linear'
      unit: 'min'
      min: '0'
      max: '1439'
      ticcount: '1440'
      # dist: 'equalnum'
      labels:
        - { pos: '0',        text: "- 24 h"  }
        - { pos: '120',      text: "- 22 h"  }
        - { pos: '240',      text: "- 20 h"  }
        - { pos: '360',      text: "- 18 h"  }
        - { pos: '480',      text: "- 16 h"  }
        - { pos: '600',      text: "- 14 h"  }
        - { pos: '720',      text: "- 12 h"  }
        - { pos: '840',      text: "- 10 h"  }
        - { pos: '960',      text: "-  8 h"  }
        - { pos: '1080',     text: "-  6 h"  }
        - { pos: '1200',     text: "-  4 h"  }
        - { pos: '1320',     text: "-  2 h"  }
        - { pos: '1439',     text: "now"  }
   y-axes:
      type: 'linear'
      unit: 'GiBs'
      min: '0'
      max: '3000'
      ticcount: '10'
   traces:
      - trace:
        name: 'Host_Free'
        data_database:       'loadmemstate'
        data_table:          'loadmem_aggr_by_ts'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,(total_mem_avg-used_mem_avg)/1024.0 as y
             FROM loadmem_aggr_by_ts
             WHERE x>=0
             ORDER BY x
      - trace:
        name: 'Host_Used'
        data_database:       'loadmemstate'
        data_table:          'loadmem_aggr_by_ts'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,used_mem_avg/1024.0 as y
             FROM loadmem_aggr_by_ts
             WHERE x>=0
             ORDER BY x
      - trace:
        name: 'GPU_Free'
        data_database:       'gpustate'
        data_table:          'gpu_aggr_by_ts'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,gpu_numgpus*gpu_memf_avg/1024.0/1024.0/1024.0/1024.0 as y
             FROM gpu_aggr_by_ts
             WHERE x>=0
             ORDER BY x
      - trace:
        name: 'GPU_Used'
        data_database:       'gpustate'
        data_table:          'gpu_aggr_by_ts'
        keycol: x
        valcol: y
        sql: SELECT CAST(24.0*60.0 - ((TS_NOW-ts)/60.0) AS INT) as x,gpu_numgpus*gpu_memu_avg/1024.0/1024.0/1024.0/1024.0 as y
             FROM gpu_aggr_by_ts
             WHERE x>=0
             ORDER BY x
