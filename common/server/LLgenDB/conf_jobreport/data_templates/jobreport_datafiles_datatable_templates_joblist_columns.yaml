- {
    field: "jobid",
    headerName: "JobID",
    headerTooltip: "Slurm JobID",
    cellDataType: "number",
    valueGetter: "(params) => params.data ? parseInt(params.data.jobid, 10) : null",
    pinned: "left",
    sort: "desc",
    minWidth: 75,
    maxWidth: 90,
  }

# Job general info
- {
    headerName: "General Info",
    groupId: "Info",
    children: [
      {
        field: "owner",
        headerName: "Owner", 
        headerTooltip: "User owner of the job",
        cellDataType: "text",
        cellRenderer: "(params) => gen_project_user_link(params,'/data/ll/user','account')",
        cellClass: "text-left",
      },
      {
        field: "account",
        headerName: "Project",
        headerTooltip: "Budget used for job submission" ,
        cellDataType: "text", 
        cellRenderer: "(params) => gen_project_link(params,'/data/ll/project')",
      },
      {
        field: "queue",
        headerName: "Queue",
        cellDataType: "text",
        headerTooltip: "Slurm partition",
      },
      {
        field: "nodeh",
        headerName: "Node-h",
        cellDataType: "number",
        headerTooltip: "Total compute resources consumed in node-hours",
      },
      { 
        field: "ld_ndps", 
        cellDataType: "number", 
        headerName: "#Samples", 
        headerTooltip: "Number of (1-minute) data samples stored in database for this job",
        columnGroupShow: "open",
      },
    ]
  }

- { 
    field: "mentor",
    cellDataType: "text", 
    headerName: "Mentor", 
    cellRenderer: "(params) => gen_mentor_link(params,'/data/ll/mentor')",
    headerTooltip: "Mentor of the project" ,
    cellClass: "text-left",
  }

# Job Slurm scheduling info
- {
    headerName: "Scheduler",
    groupId: "Scheduler",
    children: [
      { 
        field: "starttime",
        cellDataType: "dateString",
        headerName: "Start Date",
        # minWidth: 125,
        # flex: 2,
        headerTooltip: "Start date of the job",
        filter: "DateTimeParentFilter",
        floatingFilterComponent: "DateFloatingFilterComponent",
      },
      { 
        field: "ts",
        cellDataType: "dateString",
        headerName: "Last Update",
        # minWidth: 125,
        headerTooltip: "Date of last update from scheduler or end time of job",
        filter: "DateTimeParentFilter",
        floatingFilterComponent: "DateFloatingFilterComponent",
      },
      { 
        field: "endtime",
        columnGroupShow: "open",
        cellDataType: "dateString",
        headerName: "End Date (est)",
        # minWidth: 125,
        headerTooltip: "Estimated end date of the job (Start Date + Walltime)",
        filter: "DateTimeParentFilter",
        floatingFilterComponent: "DateFloatingFilterComponent",
      },
      { 
        field: "lastts",
        columnGroupShow: "open",
        cellDataType: "dateString",
        headerName: "Since Last Update",
        headerTooltip: "Time passed since the last job update" ,
        filter: "DateTimeParentFilter",
        floatingFilterComponent: "DateFloatingFilterComponent",
      },
      { 
        field: "wall",
        columnGroupShow: "open",
        headerName: "Walltime",
        headerTooltip: "Requested walltime",
        cellDataType: "timeInterval",
        filter: "TimeIntervalParentFilter",
        floatingFilterComponent: "TimeIntervalFloatingFilterComponent",
      },
      { 
        field: "runtime",
        headerName: "Runtime",
        headerTooltip: "Overall runtime",
        cellDataType: "timeInterval",
        filter: "TimeIntervalParentFilter",
        floatingFilterComponent: "TimeIntervalFloatingFilterComponent",
      },
      { 
        field: "numnodes",
        cellDataType: "number",
        headerName: "#Nodes",
        headerTooltip: "Number of nodes used by the job",
      },
      { 
        field: "nsteps",
        headerName: "#Steps",
        cellDataType: "number",
        headerTooltip: "Number of steps within the job",
        columnGroupShow: "open",
      },
      {
        field: "restart",
        headerName: "Restarts",
        cellDataType: "number",
        columnGroupShow: "open",
        headerTooltip: "Number of times the job was restarted"
      },
      { 
        field: "waittime",
        columnGroupShow: "open",
        headerName: "Wait Time",
        headerTooltip: "Wait time before job start (difference between start time and submit time)",
        # cellDataType: "text",
        cellDataType: "timeInterval",
        filter: "TimeIntervalParentFilter",
        floatingFilterComponent: "TimeIntervalFloatingFilterComponent",
      },
      { 
        field: "resid",
        columnGroupShow: "open",
        cellDataType: "text",
        headerName: "Reservation",
        cellClass: "text-left",
        headerTooltip: "Reservation used by the job"
      },
    ]
  }

