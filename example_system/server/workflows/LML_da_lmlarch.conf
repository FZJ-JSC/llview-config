<LML_da_workflow>
  <vardefs>
    <var key="instdir"        value="${LLVIEW_HOME}/da" /> 
    <var key="configdir"      value="${LLVIEW_CONF}"/>
    <!-- Common folders -->
    <var key="tmpdir"         value="./tmp"/>
    <var key="tmpcntdir"      value="./tmp/cnt"/>
    <var key="permdir"        value="./perm"/>
    <var key="logdir"         value="./logs"/>
    <var key="archdir"        value="./arch"/>
    <var key="shareddir"      value="${LLVIEW_SHARED}/remote" />
    <!-- These variables are used by LML_da.pl -->
    <var key="signalfilename" value="RUNNING_lmlarch"/>
    <!-- These variables are used by LML_da_par_step.pl -->
    <var key="steptimingfile" value="./tmp/step_timing_lmlarch_new.xml" />
    <var key="name"           value="lmlarch" />
    <var key="stepcounter"    value="./tmp/cnt/stepcounter_lmlarch.dat" />
    <var key="tmplmlarchdir"  value="./tmp/lmlarch"/>
    <!-- Variables used below -->
    <var key="perl"           value="perl" />
    <var key="python"         value="${PYTHON}" />
    <var key="instdir_old"    value="${HOME}/llview/da" /> 
    <var key="workflowdir"    value="${LLVIEW_CONF}/server/workflows"/>
  </vardefs>

  <step active="1" id="start_lmlarch" exec_after="" type="execute">
    <cmd exec="echo 'starting LML_da_arch.conf'"/>
  </step>

  <!-- --------------------------------------- -->
  <!--   combine all data                      -->
  <!-- --------------------------------------- -->
  <!--  removed $tmplmlarchdir/io_out_l.xml --> 
  <!-- Create a single xml file with the combined data of all xml files (for archiving and replay) -->
  <step active="1" id="lmlarch_combine" exec_after="start_lmlarch" type="execute">
    <cmd  exec="$perl $instdir/LML_combiner/LML_combine_obj.pl  -noupdate
                                                                -nopstat 
                                                                -o $permdir/LMLraw_all.xml
                                                                $tmplmlarchdir/sysinfo_LML.xml 
                                                                $tmplmlarchdir/nodes_LML.xml 
                                                                $tmplmlarchdir/jobs_LML.xml
                                                                $tmplmlarchdir/reservation_LML.xml 
                                                                $tmplmlarchdir/classes_LML.xml 
                                                                $tmplmlarchdir/nodereasons_LML.xml 
                                                                $tmplmlarchdir/jobs_step_LML.xml
                                                                $tmplmlarchdir/nodepower_LML.xml 
                                                                $tmplmlarchdir/icnodemap.xml
                                                                $tmplmlarchdir/gpus_LML.xml
                                                                $tmplmlarchdir/cores_LML.xml
                                                                $tmplmlarchdir/cores.percore_LML.xml
                                                                $tmplmlarchdir/ibms_LML.xml 
                                                                $tmplmlarchdir/login_*.xml
                                                                $tmplmlarchdir/accountmap.xml
                                                                $tmplmlarchdir/LMLDBstat.xml 
                                                                $tmplmlarchdir/jobs_errmsg_HC_LML.xml 
                                                                $tmplmlarchdir/nodes_errmsg_HC_LML.xml
                                                                "/>
  </step>

  <!-- --------------------------------------- -->
  <!--   archive LML file                      -->
  <!-- --------------------------------------- -->
  <!-- Archive the data using the unified LML created in the combineLML_all step -->
  <step active="1" id="lmlarch_tar" exec_after="lmlarch_combine" type="execute">
    <cmd  exec="$perl $instdir/LML_HistoryMGR/LML_da_historyMGR.pl  -infile=$permdir/LMLraw_all.xml
                                                                    -format=LML 
                                                                    -histdir=$archdir/LMLall/
                                                                    "/>
  </step>

</LML_da_workflow>
